<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="../../vendor/react.development.js"></script><script src="../../vendor/react-dom.development.js"></script><script src="../../vendor/babel.min.js"></script></head><body style="margin:0;padding:20px;background:var(--bg-0)"><div id="root"></div>
<!-- The prebuilt _ds_bundle.js carries a stale SlotBadge that throws, so this card loads the components from their sources; Babel's UMD transform resolves the React import as lowercase react. -->
<script>window.react = window.React;</script>
<script type="text/babel" data-plugins="transform-modules-umd" src="../core/Badge.jsx"></script>
<script type="text/babel" data-plugins="transform-modules-umd" src="./QuotaMeter.jsx"></script>

<script type="text/babel" data-plugins="transform-modules-umd" src="./SubscriptionCard.jsx"></script>
<script type="text/babel">
const {QuotaMeter}=window.QuotaMeter;
const {SlotBadge}=window.SlotBadge;
const {SubscriptionCard}=window.SubscriptionCard;
function Demo(){
  return <div style={{display:"flex",gap:20,alignItems:"flex-start"}}>
    <SubscriptionCard provider="Claude" plan="Max 20x" account="kun@gmail.com" status="fresh" width={330}
      windows={[{label:"session",percentRemaining:74,pace:"ahead",resetText:"resets 3pm"},{label:"weekly",percentRemaining:62,pace:"on_pace",resetText:"resets Fri"},{label:"opus weekly",percentRemaining:9,pace:"behind",resetText:"resets Fri"}]}

      <QuotaMeter label="weekly" percentRemaining={62} pace="on_pace" resetText="resets Fri 9am"/>
      <QuotaMeter label="session" percentRemaining={91} pace="ahead" resetText="resets 3pm"/>
      <QuotaMeter label="credits" percentRemaining={8} pace="behind" resetText="runway 6h"/>

      <div style={{display:"flex",gap:18,marginTop:4}}><SlotBadge slot="premium"/><SlotBadge slot="high"/><SlotBadge slot="medium"/><SlotBadge slot="low"/></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
