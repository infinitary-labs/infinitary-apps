<!-- @dsCard group="Colors" viewport="700x140" name="Accent" subtitle="Ice cyan — the light of the first mate; one accent per screen, and one per figure" --><!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-0);font-family:var(--font-ui)}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:var(--accent);border:1px solid var(--line-1)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--accent</div><div style="font-size:11px;color:var(--fg-3)">accent</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:var(--accent-strong);border:1px solid var(--line-1)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--accent-strong</div><div style="font-size:11px;color:var(--fg-3)">pressed / hover</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--line-1)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--accent-dim</div><div style="font-size:11px;color:var(--fg-3)">tint fill</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:10px;background:var(--bg-1);border:1px solid var(--line-1);box-shadow:var(--glow-accent)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--glow-accent</div><div style="font-size:11px;color:var(--fg-3)">reserved for the character + active states</div></div></div></body></html>
