<!-- @dsCard group="Brand" viewport="700x120" name="Keybind glyphs" subtitle="Real keyboard symbols only; keycaps in JetBrains Mono" --><!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-0);font-family:var(--font-ui)}</style></head><body><div style="display:flex;align-items:center;gap:10px;font-size:var(--text-base);color:var(--fg-2)"><span>press/hold</span><kbd style="font-family:var(--font-mono);font-size:12.5px;color:var(--fg-2);background:var(--bg-3);border:1px solid var(--line-1);border-bottom-width:2px;border-radius:6px;padding:2px 7px">⌥</kbd><span>to talk · also</span><kbd style="font-family:var(--font-mono);font-size:12.5px;color:var(--fg-2);background:var(--bg-3);border:1px solid var(--line-1);border-bottom-width:2px;border-radius:6px;padding:2px 7px">⌘</kbd> <kbd style="font-family:var(--font-mono);font-size:12.5px;color:var(--fg-2);background:var(--bg-3);border:1px solid var(--line-1);border-bottom-width:2px;border-radius:6px;padding:2px 7px">⇧</kbd> <kbd style="font-family:var(--font-mono);font-size:12.5px;color:var(--fg-2);background:var(--bg-3);border:1px solid var(--line-1);border-bottom-width:2px;border-radius:6px;padding:2px 7px">⎋</kbd> <kbd style="font-family:var(--font-mono);font-size:12.5px;color:var(--fg-2);background:var(--bg-3);border:1px solid var(--line-1);border-bottom-width:2px;border-radius:6px;padding:2px 7px">space</kbd></div></body></html>
