<!-- @dsCard group="Foundations" viewport="700x140" name="Motion" subtitle="Slow, drifting, never bouncy — 360–700ms" --><!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-0);font-family:var(--font-ui)}@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(180px)}}</style></head><body><div style="display:flex;flex-direction:column;gap:16px;padding:6px 2px"><div style="display:flex;align-items:center;gap:16px"><div style="width:240px;height:20px;position:relative"><div style="width:20px;height:20px;border-radius:50%;background:var(--accent);opacity:0.9;animation:drift 2.4s var(--ease-drift) infinite"></div></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--ease-drift</span><span style="font-size:11px;color:var(--fg-3)">state changes, bars</span></div><div style="display:flex;align-items:center;gap:16px"><div style="width:240px;height:20px;position:relative"><div style="width:20px;height:20px;border-radius:50%;background:var(--accent);opacity:0.9;animation:drift 1.6s var(--ease-out) infinite"></div></div><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--ease-out</span><span style="font-size:11px;color:var(--fg-3)">entrances, hovers</span></div></div></body></html>
