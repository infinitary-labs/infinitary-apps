name: Electron's download
description: Keep what a dependency install downloads from GitHub's release server - Electron's binary and, on macOS, the app's own git - in the Actions cache, so the install reads it there instead.
inputs:
  working-directory:
    description: Checkout whose package.json names the Electron and dugite versions.
    default: .
  zips:
    description: Electron zips the job reads beyond the one its install downloads, as platform-arch words (a universal Mac package reads darwin-arm64 and darwin-x64); they join the cache key, so the cache keeps them too.
    default: ""
runs:
  using: composite
  steps:
    # A GitHub-hosted runner, and each virtual machine the placement service
    # makes fresh for one job and deletes after it (a Mac's clone of the one
    # image, a Linux machine on the PC), starts with no Electron. Electron's
    # own installer, which pnpm install runs
    # (scripts/ensure-electron-installed.mjs), then downloads it from GitHub's
    # release server on every job, with no retry: one 504 there failed main's
    # Linux code checks, and one download that stalled for five minutes failed
    # a batch's Mac journeys on a fresh virtual Mac. Restored here, a job
    # reaches that server only on a version's first download, on every kind of
    # runner; one that kept Electron's own cache reads the cached copy instead.
    #
    # On macOS the same install also fetches the app's own git for both chips
    # (scripts/ensure-bundled-git.ts, dugite-native's archives, also on
    # GitHub's release server; one 504 there failed an iPad check before any
    # test ran). Its archives are kept the same way, under a key naming the
    # dugite version that pins them; the script checks each restored archive
    # against dugite's checksum and downloads again only one that differs.
    - id: electron
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ZIPS: ${{ inputs.zips }}
      run: |
        # electron's install.js reads its download cache from electron_config_cache.
        dir="$RUNNER_TEMP/electron-cache"
        printf 'electron_config_cache=%s\n' "$dir" >> "$GITHUB_ENV"
        printf 'dir=%s\n' "$dir" >> "$GITHUB_OUTPUT"
        printf 'version=%s\n' "$(node -p 'require("./package.json").devDependencies.electron')" >> "$GITHUB_OUTPUT"
        # Every zip the job reads names its own key: a cache saved without one
        # never gains it, since a restored key is never saved again.
        read -ra zips <<< "$ZIPS"
        suffix=""
        for zip in "${zips[@]}"; do suffix="$suffix-$zip"; done
        printf 'zips=%s\n' "$suffix" >> "$GITHUB_OUTPUT"
        # The install's git script (ensure-bundled-git.ts) reads its archive folder from INFINITARY_BUNDLED_GIT_CACHE.
        git="$RUNNER_TEMP/bundled-git"
        printf 'INFINITARY_BUNDLED_GIT_CACHE=%s\n' "$git" >> "$GITHUB_ENV"
        printf 'git-dir=%s\n' "$git" >> "$GITHUB_OUTPUT"
        printf 'dugite=%s\n' "$(node -p 'require("./package.json").dependencies.dugite')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.electron.outputs.dir }}
        key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}${{ steps.electron.outputs.zips }}
        # A key's first job starts from the install's own zip and keeps the rest it reads.
        restore-keys: ${{ steps.electron.outputs.zips != '' && format('electron-{0}-{1}-{2}', runner.os, runner.arch, steps.electron.outputs.version) || '' }}
    # Only the archives: the unpacked trees beside them are rebuilt from them.
    - if: runner.os == 'macOS'
      uses: actions/cache@v4
      with:
        path: ${{ steps.electron.outputs.git-dir }}/*.tar.gz
        key: bundled-git-${{ runner.os }}-${{ steps.electron.outputs.dugite }}
