name: Linux automatic startup
description: Exercise startup classification with real systemd and container fixtures.
runs:
  using: composite
  steps:
    - id: systemd
      if: ${{ !cancelled() }}
      name: Running systemd, logged-out user, and working user manager
      shell: bash
      run: |
        set -euo pipefail
        test "$(cat /proc/1/comm)" = systemd
        user=infinitary-startup-fixture
        sudo useradd --create-home "$user"
        uid=$(id -u "$user")
        fixture=$(mktemp -d)
        chmod 0755 "$fixture"
        mkdir -p "$fixture/scripts" "$fixture/src/core/helper"
        cp scripts/check-linux-startup.ts "$fixture/scripts/"
        cp src/core/helper/linuxStartup.ts "$fixture/src/core/helper/"
        cleanup() {
          rm -rf "$fixture"
          sudo systemctl stop "user@$uid.service" || true
          sudo loginctl disable-linger "$user" || true
          sudo userdel --remove "$user" || true
        }
        trap cleanup EXIT
        test "$(loginctl list-sessions --no-legend | awk -v u="$user" '$0 ~ u { print }')" = ""
        sudo -u "$user" env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="/run/user/$uid" "$(command -v node)" "$fixture/scripts/check-linux-startup.ts" at-login
        sudo loginctl enable-linger "$user"
        sudo systemctl start "user@$uid.service"
        sudo -u "$user" env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR="/run/user/$uid" "$(command -v node)" "$fixture/scripts/check-linux-startup.ts" available
    - id: container
      if: ${{ !cancelled() }}
      name: Plain Ubuntu container, with and without systemctl
      shell: bash
      run: |
        set -euo pipefail
        # The machine's own systemctl and every library it loads, from the
        # same Ubuntu release as the image, go into a container with no
        # network, so the fixture downloads no package: Ubuntu's archive
        # refusing connections would fail it with no change to the code.
        installed=$(mktemp -d)
        trap 'rm -rf "$installed"' EXIT
        chmod 0755 "$installed"
        systemctl=$(command -v systemctl)
        for file in "$systemctl" $(ldd "$systemctl" | awk '$2 == "=>" && $3 ~ /^\// { print $3 }'); do
          place="$(readlink -f "$(dirname "$file")")/$(basename "$file")"
          mkdir -p "$installed$(dirname "$place")"
          cp -L "$file" "$installed$place"
        done
        docker run --rm --network none -v "$PWD:/work:ro" -v "$installed:/installed:ro" -v "$(dirname "$(command -v node)"):/node:ro" -w /work ubuntu:24.04 bash -euc '
          cp -r --update=none /installed/. /
          command -v systemctl
          systemctl --version
          /node/node scripts/check-linux-startup.ts unavailable
          PATH=/no-programs /node/node scripts/check-linux-startup.ts unavailable
        '
    - name: Report startup fixtures
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SYSTEMD: ${{ steps.systemd.outcome }}
        CONTAINER: ${{ steps.container.outcome }}
      run: |
        printf '### Linux automatic startup\n\n| Fixture | Result |\n| --- | --- |\n| Logged-out user and user manager | %s |\n| Plain container with and without systemctl | %s |\n' "$SYSTEMD" "$CONTAINER" >> "$GITHUB_STEP_SUMMARY"
