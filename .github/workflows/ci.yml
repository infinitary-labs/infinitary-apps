name: ci

# Pull requests retain typecheck, lint and build, and run the one
# critical-path journey (INF-2507). Edited unit files run
# three total rounds locally, never in extra PR repeat jobs. Full unit,
# integration and probe sweeps run here only on request, never on PRs.
# A push to main starts none of these jobs (INF-2340): main.yml's full check
# runs the same commands in verify.yml's linux-checks lane, every probe included.
# Which Linux machines (INI-9's plan, approved by the captain): every job
# runs on the label the repository variable LINUX_RUNNER names - the
# placement service's shell-pc-linux, a fresh VM per job on the Windows PC,
# five at once - and on GitHub's hosted ubuntu-latest when it is unset.
# The repository variable LINUX_QUEUES (DOP-251's plan) can send a job's
# kind to another queue, such as the Mac mini's Linux guests, before
# LINUX_RUNNER; a kind it leaves out keeps the label above (docs/testing.md,
# "Each Linux job's kind"). Self-hosted images supply Node 24 and their own
# pnpm store (DOP-67/68), so only GitHub-hosted jobs restore setup-node's
# pnpm cache (DOP-66 fix 1).

on:
  # Linux-only branch validation; edited unit-file rounds belong locally.
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The retained PR jobs run on every pull request, including release notes.
# Full sweeps are explicitly excluded from pull requests at the job boundary.
# Each test step ends at 30 minutes (INF-1083, the captain's choice for unit
# tests): a stuck test or wait ends sooner, by its own cap of at most 10
# minutes (docs/test-cohorts.md, "Budgets"), and these steps take about two.
jobs:
  typecheck-lint-build:
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').typecheck || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its base parent, for the notes step.
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # A change adds its release note or exclusion and the ledger stays
      # consistent (docs/release-notes.md "The release check"). Plain Node, no
      # install, under a second, so a miss fails here instead of at the alpha.
      - name: Release notes
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/release-notes.ts change --base HEAD^1
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
          # Prove the actual pnpm lifecycle cannot download Node headers.
          NPM_PACKAGE_CONFIG_NODE_GYP_DISTURL: http://127.0.0.1:9
          NPM_PACKAGE_CONFIG_NODE_GYP_DEVDIR: ${{ runner.temp }}/install-header-cache
      - uses: ./.github/actions/prove-node-headers
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm lint:adherence
      - run: pnpm build
      # The unit tests that import or read each changed file run once here
      # (scripts/unit-reach.ts directUnitReach), so a break in a reader the
      # crewmate skipped fails the pull request, not main's full check.
      - name: Unit tests that read a changed file
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/unit-repeats.ts --reach --base HEAD^1 --run
        timeout-minutes: 30
      # The browser layer (docs/testing.md, "The browser layer"): every
      # browser file, about a minute, so a pull request that breaks what the
      # window draws fails here. A requested sweep runs them in unit-tests.
      - uses: ./.github/actions/browser-chromium
        if: ${{ github.event_name == 'pull_request' }}
      - name: Browser tests
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm test --project browser
        timeout-minutes: 30

  # The Linux automatic startup fixtures (docs/testing.md), a job of their own
  # so they report even when the build fails. They need systemd and Docker,
  # so their startup kind (DOP-268's plan) may name only a PC queue, such as
  # the PC's PR line; without it they go where LINUX_RUNNER sends them.
  # INF-2486 cut F: a change whose every path is docs, primitives, Markdown,
  # release notes or a workflow other than this one skips the fixture step,
  # and the job still reports (scripts/startup-paths.ts).
  linux-startup:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').startup || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its base parent, for the paths step.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Startup paths
        id: paths
        run: node scripts/startup-paths.ts --base HEAD^1
      - name: Linux automatic startup
        if: ${{ steps.paths.outputs.run == 'true' }}
        uses: ./.github/actions/linux-startup

  # The critical path (INF-2480's plan, captain: "path six-steps (launch, sign
  # in, project, first mate, crewmate card, merge)"; INF-2507): the one
  # journey every pull request runs, the app built from the pull request's
  # merge commit on the Linux desktop (docs/testing.md, "The critical path").
  # A change that edits it runs it three rounds and alone, as any edited
  # journey; every other journey runs on request and in main's desktop
  # release check.
  critical-path:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/source-journeys.yml
    with:
      suite: affected
      lane: desktop
      files: tests/e2e/critical-path.spec.ts
      artifact-suffix: critical-path

  # The in-memory cohorts and the browser layer (docs/test-cohorts.md).
  unit-tests:
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      # The browser layer (docs/testing.md, "The browser layer").
      - uses: ./.github/actions/browser-chromium
      - run: pnpm test --project pure --project unit --project unit-isolated --project browser
        timeout-minutes: 30

  # The integration cohort, split by vitest's own --shard (a hash of each
  # file's path), on machines of their own so nothing else loads the host
  # its budgets measure. Each shard reports even when the other fails.
  integration-tests:
    if: github.event_name != 'pull_request'
    name: integration-tests (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - run: pnpm test --project integration --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        timeout-minutes: 30

  # Probes can fail with no code change (docs/test-cohorts.md, "Probes").
  # Run every probe on request, never a changed-path selection.
  probe-tests:
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.LINUX_QUEUES || '{}').ci || vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - run: pnpm test --project probe
        timeout-minutes: 30
