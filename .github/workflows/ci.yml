name: ci

# Pull requests retain typecheck, lint, build, affected probes and changed-test
# repetitions. Full unit and integration sweeps run on main and on request,
# never on pull requests (INF-2224, captain: "Move both to main").
# Releases keep the full suite in verify.yml, including every probe.
# Which Linux machines (INI-9's plan, approved by the captain): every job
# runs on the label the repository variable LINUX_RUNNER names - the
# placement service's shell-pc-linux, a fresh VM per job on the Windows PC,
# five at once - and on GitHub's hosted ubuntu-latest when it is unset.
# The shell PC image supplies Node 24 and its own pnpm store (DOP-67/68),
# so only hosted jobs restore setup-node's pnpm cache (DOP-66 fix 1).

on:
  # Linux-only branch validation, including repeated unit-job proofs.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The retained PR jobs run on every pull request, including release notes.
# Full sweeps are explicitly excluded from pull requests at the job boundary.
# Each test step ends at 30 minutes (INF-1083, the captain's choice for unit
# tests): a stuck test or wait ends sooner, by its own cap of at most 10
# minutes (docs/test-cohorts.md, "Budgets"), and these steps take about two.
jobs:
  typecheck-lint-build:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !vars.LINUX_RUNNER && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
          # Prove the actual pnpm lifecycle cannot download Node headers.
          NPM_PACKAGE_CONFIG_NODE_GYP_DISTURL: http://127.0.0.1:9
          NPM_PACKAGE_CONFIG_NODE_GYP_DEVDIR: ${{ runner.temp }}/install-header-cache
      - uses: ./.github/actions/prove-node-headers
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm lint:adherence
      - run: pnpm build

  # The in-memory cohorts (docs/test-cohorts.md).
  unit-tests:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !vars.LINUX_RUNNER && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - run: pnpm test --project pure --project unit --project unit-isolated
        timeout-minutes: 30

  # The integration cohort, split by vitest's own --shard (a hash of each
  # file's path), on machines of their own so nothing else loads the host
  # its budgets measure. Each shard reports even when the other fails.
  integration-tests:
    if: github.event_name != 'pull_request'
    name: integration-tests (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !vars.LINUX_RUNNER && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - run: pnpm test --project integration --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        timeout-minutes: 30

  # The probes (docs/test-cohorts.md, "Probes"): integration files that can
  # fail with no code change - SSH and Remote Login stand-ins, dns-sd, release
  # rehearsals, the connection listener, real Playwright runs. This job runs
  # only the probes whose paths the change edits, from its merge base with
  # main on a pull request and from the previous main on a push, and its
  # summary says which and why. A base it cannot read runs them all.
  probe-tests:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !vars.LINUX_RUNNER && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - run: pnpm test:probes --base "$BASE"
        timeout-minutes: 30
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  # A change's unit-file repeats (docs/testing.md, "This project's rulings
  # on tests"; INF-2074's ci-gate fix): each Vitest file the change adds or
  # edits runs ten times in a row with no retries, here on Linux instead of
  # the Mac mini's load line. Files on scripts/mac-unit-tests.ts need a Mac,
  # so their repeats stay there. A push to main repeats nothing, since its
  # pull request already did; each shard passes with no file to repeat.
  # As with integration-tests, Vitest splits files across two machines.
  # Every file still runs ten fresh rounds, within the same step deadline.
  unit-repeats:
    name: unit-repeats (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !vars.LINUX_RUNNER && 'pnpm' || '' }}
      - uses: ./.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - run: pnpm test:repeats --base "$BASE" --shard "$SHARD"
        timeout-minutes: 30
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'workflow_dispatch' && 'origin/main' || '' }}
