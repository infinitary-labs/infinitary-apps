name: contributors

# An outside contributor's pull request (docs/public-ci.md, "Outside
# contributors"), on GitHub's own machines only: ci.yml runs its branch check
# on hosted Ubuntu, and this workflow runs what a task branch of this project
# requests for itself, since a contributor cannot request a run - the
# journeys its change can break (scripts/affected-journeys.ts --request) on
# hosted Ubuntu and, for their tests that need a Mac and each edited journey
# once, on hosted Mac (journeys.yml), and the Windows installer's build on
# hosted Windows when the change reaches it (scripts/windows-paths.ts,
# windows.yml). The fresh Windows 11 check, the signed installer checks,
# signing and TestFlight need the project's own machines, so they wait for
# the batch, which runs every check again before the change reaches main.
# A pull request of this project itself starts this file and skips every job.
# A pull request runs the check files it carries, so the owner's approval of
# each outside run, not this routing, keeps a contributor off the project's
# machines.

on:
  pull_request:

permissions:
  contents: read

# A new push replaces the pull request's older run, as ci.yml's group does.
concurrency:
  group: contributors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the change reaches, read from the pull request's merge commit
  # against its base parent. Its name leads with what started it
  # (scripts/ci-job-names.mjs).
  paths:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    name: Pull request · Choose the contributor's journeys and Windows build (Linux)
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.read.outputs.base }}
      journeys: ${{ steps.read.outputs.journeys }}
      windows: ${{ steps.read.outputs.windows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/node-headers
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      - id: read
        name: Read the change's journeys and Windows reach
        run: |
          base=$(git rev-parse HEAD^1)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          journeys=$(node scripts/affected-journeys.ts --request --base "$base" | tr '\n' ' ' | sed 's/ *$//')
          echo "journeys=$journeys" >> "$GITHUB_OUTPUT"
          echo "Journeys: ${journeys:-none}"
          node scripts/windows-paths.ts --base "$base"

  # The chosen journeys, every job on GitHub's hosted machines.
  journeys:
    needs: paths
    if: ${{ needs.paths.outputs.journeys != '' }}
    name: Pull request · Contributor's app journeys
    # journeys.yml's request-replacing job asks to cancel runs, and GitHub
    # refuses a call whose grant is short of any called job's ask, even one
    # that skips; an outside pull request's token stays read-only whatever
    # this grants.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/journeys.yml
    with:
      trigger: Pull request
      hosted: true
      files: ${{ needs.paths.outputs.journeys }}
      platforms: both
      base: ${{ needs.paths.outputs.base }}
      mac_once: true

  # The Windows installer built on GitHub's hosted Windows; the fresh
  # Windows 11 check needs the PC's clean machine and waits for the batch.
  windows:
    needs: paths
    if: ${{ needs.paths.outputs.windows == 'true' }}
    name: Pull request · Contributor's Windows build
    uses: ./.github/workflows/windows.yml
    with:
      trigger: Pull request
      ref: ${{ github.sha }}
      hosted: true
