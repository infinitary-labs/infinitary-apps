name: Linux automatic startup

# Called by main.yml once per main check (INF-2441), never started by a push
# of its own: the pull request already ran the same fixtures on its version.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  runtime-facts:
    # main.yml is the only caller, and main's Linux jobs run on GitHub's
    # hosted Ubuntu (docs/testing.md, "Main's desktop release check"), a fresh
    # machine with systemd and Docker. The pull request's copy in ci.yml
    # keeps LINUX_RUNNER.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/linux-startup
