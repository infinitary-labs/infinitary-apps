name: Linux automatic startup

# Called by the batch checks on each batch pull request's version
# (batch-checks.yml), and by main.yml's full check for files no batch built
# (INF-2441, INF-3052), never started by a push of its own.
on:
  workflow_call:
    inputs:
      trigger:
        description: What started the caller's run, which every job name here leads with (scripts/ci-job-names.mjs)
        type: string
        required: true
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  runtime-facts:
    name: ${{ format('{0} · Automatic startup checks (Linux)', inputs.trigger) }}
    # Both callers run their Linux jobs on GitHub's hosted Ubuntu
    # (docs/testing.md, "A release's hosted machines"), a fresh machine with
    # systemd and Docker.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/linux-startup
