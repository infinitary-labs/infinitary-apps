name: Linux automatic startup

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-facts:
    # INF-1617 asked for GitHub-hosted fixtures; INF-1720's approved plan
    # moves them to LINUX_RUNNER (ci.yml says how), whose PC job is also a
    # fresh virtual machine deleted after the job. Hosted when it is unset.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/linux-startup
