name: Linux automatic startup

# Called by main.yml once per main check (INF-2441), never started by a push
# of its own: the pull request already ran the same fixtures on its version.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  runtime-facts:
    # INF-1617 asked for GitHub-hosted fixtures; INF-1720's approved plan
    # moves them to LINUX_RUNNER (ci.yml says how), whose PC job is also a
    # fresh virtual machine deleted after the job. Hosted when it is unset.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/linux-startup
