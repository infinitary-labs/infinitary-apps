name: Verify signed installer and updater

on:
  workflow_call:
    inputs:
      trigger:
        description: What started the caller's run, which every job name here leads with (scripts/ci-job-names.mjs)
        type: string
        required: true
      ref:
        required: true
        type: string
      reuse:
        description: Reviewed JSON declaration for reusing an existing signed artifact; empty builds fresh copies
        required: false
        type: string
        default: ''
      chip:
        description: Which installed checks run - both, or only arm64 or x64 for a recheck the captain approved for one Mac type
        required: false
        type: string
        default: both

permissions:
  contents: read
  actions: read

jobs:
  build:
    environment: mac-installer-signing
    # Main dispatches use their own commit. The protected release workflow may also
    # pass the merged source verified by its read-only resolver. Build the
    # caller's ref from components: it identifies the caller, not a file this job reads.
    if: ${{ inputs.reuse == '' && (github.repository == 'infinitary-labs/infinitary' || (github.ref == 'refs/heads/main' && (inputs.ref == github.sha || github.workflow_ref == format('{0}/{1}/workflows/release.yml@refs/heads/main', github.repository, '.github')))) }}
    name: ${{ format('{0} · Build signed test copies (Mac)', inputs.trigger) }}
    # DOP-42: request a disposable guest, with the kernel guard still required below;
    # the build kind's virtual-only queue once MAC_QUEUES names it.
    runs-on: ${{ fromJSON(vars.MAC_QUEUES || '{}').build || 'mini-mac-virtual' }}
    timeout-minutes: 180
    env:
      SIGN_IDENTITY: "Developer ID Application: Kun Chen (9T2J7MNUP9)"
    steps:
      # A refused checkout waits until GitHub takes the job's token again,
      # then runs once more (docs/testing.md, "GitHub refusing a job's token").
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &build-checkout
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        env:
          TOKEN: ${{ github.token }}
        run: &wait-for-token |
          # Asks the address the checkout's fetch reads, with the job's token
          # as the checkout sends it, every 15 seconds for up to 10 minutes,
          # then lets the checkout try once more. A failure GitHub's token
          # did not cause, such as a missing commit, is tried again at once.
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/info/refs?service=git-upload-pack"
          patience="${CHECKOUT_PATIENCE_SECONDS:-600}"
          pause="${CHECKOUT_PAUSE_SECONDS:-15}"
          started=$SECONDS
          while :; do
            # The token reaches curl on its input, never on its command line.
            answer="$(printf 'user = "x-access-token:%s"\n' "$TOKEN" |
              curl --silent --location --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 30 --max-time 60 --config - --url "$url")" || true
            if [[ "$answer" == 2?? ]]; then exit 0; fi
            waited=$((SECONDS - started))
            if ((waited >= patience)); then
              echo "::warning title=GitHub still refuses the job's token::It answered $answer after ${waited}s; the checkout tries once more."
              exit 0
            fi
            echo "GitHub answered $answer to the job's token after ${waited}s; asking again in ${pause}s"
            sleep "$pause"
          done
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *build-checkout
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Refuse the physical Mac before installing or restoring credentials
        id: isolation
        run: node scripts/installer-environment.ts
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
      - name: Isolate the signing home
        run: |
          mkdir -p "$RUNNER_TEMP/installer-home"
          echo "HOME=$RUNNER_TEMP/installer-home" >> "$GITHUB_ENV"
          echo "CFFIXED_USER_HOME=$RUNNER_TEMP/installer-home" >> "$GITHUB_ENV"
          echo "INFINITARY_LOCAL_CODESIGN_DIR=$RUNNER_TEMP/installer-home/local-codesign" >> "$GITHUB_ENV"
      - name: Restore the existing release identity into the disposable Mac
        env:
          MAC_DEVELOPER_ID_CERT_P12: ${{ secrets.MAC_DEVELOPER_ID_CERT_P12 }}
          MAC_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: node scripts/installer-signing.mjs restore
      - run: pnpm build
      # The disk images' dmgbuild, which electron-builder downloads from GitHub's
      # release server, from the Actions cache (docs/testing.md, "Downloads from
      # GitHub's release server").
      - uses: ./.github/actions/electron-builder-tools
      - name: Build and notarize the verification copies without publishing
        env:
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          INSTALLER_FIXTURES: ${{ runner.temp }}/installer-fixtures
          INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-build-evidence
        run: scripts/build-installer-fixtures.sh
      - name: Keep electron-builder's tools
        if: ${{ !cancelled() }}
        uses: ./.github/actions/electron-builder-tools
        with:
          save: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-installer-fixtures
          path: ${{ runner.temp }}/installer-fixtures
          retention-days: 1
          compression-level: 0
      - name: Remove the disposable signing material
        if: always() && steps.isolation.outcome == 'success'
        run: node scripts/installer-signing.mjs clean
      - name: Keep submission IDs and failed-request network readings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-build-evidence
          path: ${{ runner.temp }}/installer-build-evidence
          if-no-files-found: ignore

  installed:
    name: ${{ format('{0} · Install and update (Mac; {1})', inputs.trigger, matrix.chip == 'arm64' && 'Apple silicon' || 'Intel') }}
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.reuse != '' && needs.build.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        # A one-chip recheck leaves the other Mac type out of the run rather than skipping it green.
        # Runner and name follow the chip: an include entry for an absent chip would add it back.
        chip: ${{ fromJSON(inputs.chip == 'arm64' && '["arm64"]' || inputs.chip == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    runs-on: ${{ matrix.chip == 'arm64' && (fromJSON(vars.MAC_QUEUES || '{}').light || 'mini-mac-virtual') || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &installed-checkout
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *installed-checkout
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Refuse the physical Mac before installing or changing the guest
        run: node scripts/installer-environment.ts
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
      - name: Confirm the native architecture
        env:
          EXPECTED_CHIP: ${{ matrix.chip }}
        run: node -e 'if(process.arch !== process.env.EXPECTED_CHIP) throw new Error("This runner does not provide the requested native architecture");'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ inputs.reuse == '' }}
        with:
          name: signed-installer-fixtures
          path: ${{ runner.temp }}/installer-fixtures
      - name: Verify and reuse the original signed copies without signing
        id: reuse
        if: ${{ inputs.reuse != '' }}
        env:
          INSTALLER_REUSE: ${{ inputs.reuse }}
          INSTALLER_FIXTURES: ${{ runner.temp }}/installer-fixtures
          INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-evidence
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/installer-reuse.ts
      - name: Verify native updates without Homebrew, then signed cask updates
        env:
          INSTALLER_FIXTURES: ${{ runner.temp }}/installer-fixtures
          INSTALLER_EVIDENCE: ${{ runner.temp }}/installer-evidence
          INSTALLER_SOURCE_COMMIT: ${{ steps.reuse.outputs.source }}
        run: node scripts/check-installed-updates.mjs
      - name: Keep the observed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-evidence-${{ matrix.chip }}
          path: ${{ runner.temp }}/installer-evidence
          if-no-files-found: error
