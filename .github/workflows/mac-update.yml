name: Update from the last published alpha

# INF-1900 direction D (docs/alpha.md, "The update check"): on Apple silicon,
# a disposable virtual Mac installs the version alpha subscribers have now from its
# public disk image and updates it through a local alpha feed. After signing,
# the release calls it with the signing job's handoff, and the release's own
# signed zip must replace the installed app, restart it as the new version and
# keep its saved work. It builds, signs and sends nothing.
# Intel is a best-effort side effect of the universal build, never a hosted
# Mac run (the captain, INF-1900).

on:
  workflow_call:
    inputs:
      trigger:
        description: What started the caller's run, which every job name here leads with (scripts/ci-job-names.mjs)
        type: string
        required: true
      ref:
        required: true
        type: string
      version:
        description: The release's version, which the local alpha feed offers
        required: true
        type: string
      handoff_id:
        description: The signing job's handoff artifact
        required: true
        type: string
      zip_name:
        required: true
        type: string
      zip_sha256:
        required: true
        type: string
      runner:
        description: A publishing release's light queue; empty takes the light kind's queue
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  update:
    name: ${{ format('{0} · Apply published-alpha update (Mac; Apple silicon)', inputs.trigger) }}
    # A publishing release's light queue, else the light kind's
    # (docs/testing.md, "Each Mac job's kind and size").
    runs-on: ${{ inputs.runner || fromJSON(vars.MAC_QUEUES || '{}').light || 'mini-mac-virtual' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Refuse the physical Mac before installing or changing the guest
        run: node scripts/installer-environment.ts
      - run: pnpm install --frozen-lockfile
      - name: Confirm the native architecture
        run: node -e 'if(process.arch !== "arm64") throw new Error("This runner is not Apple silicon");'
      # By the immutable id the signing job recorded; the next step is the gate.
      - name: Fetch the release's signed zip
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.handoff_id }}
          path: ${{ runner.temp }}/handoff-download
          merge-multiple: true
      - name: Check it is the zip the signing job handed over
        id: zip
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
          ZIP_SHA256: ${{ inputs.zip_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/handoff-download/zip/$ZIP_NAME"
          [[ "$ZIP_NAME" == "Infinitary-$VERSION-universal.zip" ]]
          [[ "$(shasum -a 256 "$ZIP" | awk '{print $1}')" == "$ZIP_SHA256" ]]
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Update the published alpha to this release
        env:
          UPDATE_TARGET_VERSION: ${{ inputs.version }}
          UPDATE_TARGET_ZIP: ${{ steps.zip.outputs.path }}
          INSTALLER_EVIDENCE: ${{ runner.temp }}/update-evidence
        run: node scripts/check-update-from-alpha.mjs
      - name: Keep the observed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/update-evidence
          if-no-files-found: ignore
