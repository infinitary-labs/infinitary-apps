name: main

# Main's desktop release check (INF-2146, the captain's approved plan, direction
# B): every push to main starts this run, which runs the full check only for
# files no merge batch built (INF-3052; its sort job says how). It checks the
# desktop app's release (INF-2498, the captain: "the main check should be
# clarified to be specifically about the desktop app's release"): its passing
# run is what the desktop app's alpha is cut from. The workflow's name, main,
# stays, since the Automation rule reads it; its job names lead with their
# trigger, and the alpha's proof reader and stable promotion read them through
# scripts/ci-job-names.mjs. It replaces the nightly full check. Main runs no old
# journey set (INF-2480, the captain: "old set at the release check only, from
# the first piece on"): its full check is the Linux checks and the Mac lanes
# with only the tests that need a Mac, and every alpha runs every journey on
# Linux and the Mac itself, unless the swept batch already ran them on its
# files (release.yml, docs/alpha.md "Cutting an alpha").
# Main runs no phone check (INF-2492, the
# captain: "remove phone check from main altogether. we run all phone check
# parts at release"): ios-release.yml runs every part on iPhone and iPad
# before each TestFlight upload.
#
# Runs queue and never cancel one another: with cancel-in-progress false
# GitHub keeps the running run, holds at most one waiting run, and drops an
# older waiting run when a newer push arrives, so a burst of merges is checked
# once at its newest version. Its first job waits while the previous run's
# alpha is cut, in the alpha run's concurrency group on no machine
# (alpha-wait.yml), so merges keep queueing until the cut ends, and a run
# that waited while main moved cancels itself for the waiting one.
# The newest passing run of this workflow is main's green mark
# (docs/testing.md, "Main's desktop release check"); nothing else records it.

# A push whose every changed file is in the phone app or the docs starts no
# run (INF-2492, the captain's decision on INF-2498's question 1, "Skip pushes
# that change only the phone app or the docs"). Release-note change files ride
# with every change, so they count too. Phone check helpers in scripts/ and
# tests/helpers/ are not the phone app and still start a run. A docs break that
# a unit test reads surfaces at the next push that runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - "docs/**"
      # Generated from the code (pnpm generate:contract), so not a doc.
      - "!docs/contract.json"
      - "primitives/**"
      - "release-notes/changes/**"

concurrency:
  group: main-full-check
  cancel-in-progress: false

# What the called checks ask for: verify.yml reads runs, and alpha-wait.yml
# reads release runs and may cancel this run.
permissions:
  contents: read
  actions: write

jobs:
  # INF-2465: no check starts while the previous check's alpha is cut, and
  # merges made meanwhile are checked together (alpha-wait.yml says how).
  # Each job's name leads with what started the run, and every called
  # workflow gets it too (scripts/ci-job-names.mjs): a check started by hand
  # is a manual request, never a main push.
  alpha-wait:
    name: ${{ format('{0} · Alpha cut wait', (github.event_name == 'push' && 'Main push' || 'Manual request')) }}
    uses: ./.github/workflows/alpha-wait.yml
    with:
      trigger: ${{ (github.event_name == 'push' && 'Main push' || 'Manual request') }}
  # Sorts the push first (docs/testing.md, "The swept batch"): files that are
  # exactly a passed batch's are already checked, so the full check is
  # skipped, whether the batch passed in its own run or on its confirm; a
  # push before a batch's files, which main has reached or can still reach,
  # ends this run at once, cutting no alpha and leaving no failed run; only
  # files no batch built get the full check (the captain's pick on INF-3052,
  # "A: keep a fallback full check on main for versions no batch built").
  sort:
    name: ${{ format('{0} · Compare with checked batches', (github.event_name == 'push' && 'Main push' || 'Manual request')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
      pull-requests: read
      actions: write
    outputs:
      kind: ${{ steps.sort.outputs.kind }}
      batch: ${{ steps.sort.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The sort and the shipped queue's rules it reads the batch's state with.
          sparse-checkout: |
            scripts/batch.mjs
            .github/infinitary/rules.mjs
          sparse-checkout-cone-mode: false
      - id: sort
        uses: actions/github-script@v7
        env:
          TREE: ${{ github.event.head_commit.tree_id }}
        with:
          script: |
            const {pathToFileURL} = require('node:url');
            const batch = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/batch.mjs`).href);
            let sorted = {kind: 'full'};
            if (context.eventName === 'push' && process.env.TREE) {
              try {
                sorted = await batch.readMainPush(github, context.repo, {sha: context.sha, tree: process.env.TREE});
              } catch (error) {
                core.warning(`The push could not be sorted, so the full check runs: ${error.message}`);
              }
            }
            core.setOutput('kind', sorted.kind);
            core.setOutput('batch', String(sorted.run ?? ''));
            if (sorted.kind === 'landing') {
              core.notice(`Main reaches batch run ${sorted.run}'s files at a later push, whose check reads it.`);
              await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: context.runId});
            }
  # A push whose files are a passed batch's. The alpha's proof follows its
  # name to the batch run (scripts/main-alpha-proof.mjs).
  covered:
    needs: [alpha-wait, sort]
    if: needs.sort.outputs.kind == 'covered'
    name: ${{ format('{0} · Covered by batch run {1}', (github.event_name == 'push' && 'Main push' || 'Manual request'), needs.sort.outputs.batch) }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          BATCH: ${{ needs.sort.outputs.batch }}
        run: echo "Batch run $BATCH swept exactly these files."
  # The full check's checks part: the Linux checks, and the Mac lanes with
  # only the journeys tagged MAC_ONLY_TAG. The rest of the journeys run at the
  # release (INF-2480).
  verify:
    needs: [alpha-wait, sort]
    if: ${{ !cancelled() && needs.sort.outputs.kind != 'covered' && needs.sort.outputs.kind != 'landing' }}
    name: ${{ format('{0} · Desktop checks', (github.event_name == 'push' && 'Main push' || 'Manual request')) }}
    uses: ./.github/workflows/verify.yml
    with:
      trigger: ${{ (github.event_name == 'push' && 'Main push' || 'Manual request') }}
      ref: ${{ github.sha }}
      profile: stable
      part: checks
      all_journeys: false
      # Main's Linux jobs run on GitHub's hosted machines
      # (docs/testing.md, "Main's desktop release check").
      hosted: true
  # The Linux automatic startup fixtures, beside the full check, on GitHub's
  # hosted Ubuntu; a covered push's batch ran them (infinitary-batch-checks.yml).
  startup:
    needs: [alpha-wait, sort]
    if: ${{ !cancelled() && needs.sort.outputs.kind != 'covered' && needs.sort.outputs.kind != 'landing' }}
    name: ${{ format('{0} · Linux startup', (github.event_name == 'push' && 'Main push' || 'Manual request')) }}
    uses: ./.github/workflows/linux-startup.yml
    with:
      trigger: ${{ (github.event_name == 'push' && 'Main push' || 'Manual request') }}
      ref: ${{ github.sha }}
