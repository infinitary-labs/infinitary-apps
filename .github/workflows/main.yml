name: main

# The continuous run on main (INF-2146, the captain's approved plan, direction
# B): every push to main starts the full check with every journey on the Mac.
# It replaces the nightly full check. Main runs no phone check (INF-2492, the
# captain: "remove phone check from main altogether. we run all phone check
# parts at release"): ios-release.yml runs every part on iPhone and iPad
# before each TestFlight upload.
#
# Runs queue and never cancel one another: with cancel-in-progress false
# GitHub keeps the running run, holds at most one waiting run, and drops an
# older waiting run when a newer push arrives, so a burst of merges is checked
# once at its newest version. Its first job waits while the previous run's
# alpha is cut (alpha-wait.yml), so merges keep queueing until the cut ends,
# and a run that waited while main moved cancels itself for the waiting one.
# The newest passing run of this workflow is main's green mark
# (docs/testing.md, "The continuous run on main"); nothing else records it.

# A push whose every changed file is in the phone app or the docs starts no
# run (INF-2492, the captain's decision on INF-2498's question 1, "Skip pushes
# that change only the phone app or the docs"). Release-note change files ride
# with every change, so they count too. Phone check helpers in scripts/ and
# tests/helpers/ are not the phone app and still start a run. A docs break that
# a unit test reads surfaces at the next push that runs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - "docs/**"
      # Generated from the code (pnpm generate:contract), so not a doc.
      - "!docs/contract.json"
      - "primitives/**"
      - "release-notes/changes/**"

concurrency:
  group: main-full-check
  cancel-in-progress: false

# What the called checks ask for: verify.yml reads runs, and alpha-wait.yml
# reads release runs and may cancel this run.
permissions:
  contents: read
  actions: write

jobs:
  # INF-2465: no check starts while the previous check's alpha is cut, and
  # merges made meanwhile are checked together (alpha-wait.yml says how).
  alpha-wait:
    uses: ./.github/workflows/alpha-wait.yml
  # The full check: Linux checks, every Linux journey, and every journey on the Mac.
  verify:
    needs: alpha-wait
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      profile: stable
      all_journeys: true
      # Main's Linux jobs run on GitHub's hosted machines
      # (docs/testing.md, "The continuous run on main").
      hosted: true
  # The Linux automatic startup fixtures, once per main check, beside it, on
  # GitHub's hosted Ubuntu (linux-startup.yml names it: main is its only caller).
  startup:
    needs: alpha-wait
    uses: ./.github/workflows/linux-startup.yml
    with:
      ref: ${{ github.sha }}
