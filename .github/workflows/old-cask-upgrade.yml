name: old-cask-upgrade

# The old-cask switch as a person on Firstmate 3000's cask meets it
# (docs/alpha.md, "The old-cask switch"): in a throwaway virtual Mac, their
# usual brew update && brew upgrade --cask firstmate-3000@alpha lands on
# Infinitary, and Infinitary's first launch moves the saved work Firstmate
# 3000 made (scripts/check-old-cask-upgrade.sh).
#
# release.yml calls it live after every release that switched Firstmate
# 3000's cask. A pull request that changes the check or the switch's writer
# runs its rehearsal, which switches the tapped cask with that writer in a
# commit never pushed, to the newest Infinitary the channel published. It
# runs on demand, either way.

on:
  workflow_call:
    inputs:
      ref:
        description: The release's source commit, whose check runs
        required: true
        type: string
      channel:
        description: The release's channel, alpha or stable
        required: true
        type: string
      version:
        description: The release's logical version, which the switched cask must install
        required: true
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: Whose cask upgrades, firstmate-3000@alpha or firstmate-3000
        required: true
        type: choice
        options: [alpha, stable]
        default: alpha
      mode:
        description: live (the tap as published) or rehearsal (the switch made locally, never pushed)
        required: true
        type: choice
        options: [live, rehearsal]
        default: live
      version:
        description: The version the switched cask must install (default - whatever the tap offers)
        required: false
        type: string
  pull_request:
    paths:
      - scripts/check-old-cask-upgrade.sh
      - scripts/check-saved-work-move.sh
      - scripts/check-app-launch.sh
      - scripts/tap-publication.ts
      - src/core/update/tapPublication.ts
      - .github/workflows/old-cask-upgrade.yml

permissions:
  contents: read

jobs:
  upgrade:
    name: upgrade (${{ inputs.channel || 'alpha' }} ${{ github.event_name == 'pull_request' && 'rehearsal' || inputs.mode || 'live' }})
    # A fresh clone of the lane's image for this job alone, deleted after it
    # (docs/testing.md, "One image for every project"): the check installs
    # into /Applications and the home, and Homebrew quits Firstmate 3000 by
    # its bundle id, which only a throwaway Mac may take. Never the real Mac,
    # and no paid hosted Mac.
    runs-on: mini-mac-virtual
    timeout-minutes: 45
    env:
      CHANNEL: ${{ inputs.channel || 'alpha' }}
      MODE: ${{ github.event_name == 'pull_request' && 'rehearsal' || inputs.mode || 'live' }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: ${{ env.MODE == 'rehearsal' }}
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      # No package cache on a Mac (journeys.yml says why, INF-724).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The switch's writer runs through the repository's own packages.
      - if: ${{ env.MODE == 'rehearsal' }}
        run: pnpm install --frozen-lockfile
      - name: Upgrade Firstmate 3000's cask and open Infinitary
        run: scripts/check-old-cask-upgrade.sh "$CHANNEL" "$MODE" "$RUNNER_TEMP/old-cask-upgrade" ${VERSION:+"$VERSION"}
      - name: Keep the upgrade's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-cask-upgrade-${{ env.CHANNEL }}-${{ env.MODE }}
          path: ${{ runner.temp }}/old-cask-upgrade
          if-no-files-found: ignore
          retention-days: 30
