name: phone

# INF-79 / INF-136: the captain's Mac mini checks native changes and their shared contract.
# Keep an explicit skipped job on unrelated PRs instead of a path-filtered missing check.
on:
  pull_request:

permissions:
  contents: read

# INF-487: no run-level group for the pull request. A run that counts as running
# while its native job waits for the Mac mini would hold the newer version behind
# it for hours. cancel-replaced cancels the older runs of this pull request whose
# native job has not started a device gate, and a replaced version ends its own
# run before each device gate, a manual rerun of an older version included.
# A started gate is never cancelled: it deletes its own simulator.

jobs:
  cancel-replaced:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            scripts/replaced-phone-runs.ts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cancel this pull request's older phone runs
        run: node scripts/replaced-phone-runs.ts cancel-older
        env:
          GITHUB_TOKEN: ${{ github.token }}
  choose-phone:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      - uses: actions/checkout@v4
        with:
          path: Application Support/firstmate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: select
        name: Check the phone gate's inputs
        run: node scripts/affected-phone.ts --base "$BASE_REF" --head HEAD >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: origin/${{ github.base_ref }}
  native-phone:
    needs: choose-phone
    if: needs.choose-phone.outputs.run == 'true'
    # No paid hosted-Mac fallback. MAC_RUNNER currently names this Mac mini's label.
    # INF-524: the repository variable PHONE_VIRTUAL_MAC moves the device gates into
    # a fresh virtual Mac, through the phone check's own runner, which takes no
    # Mac mini slot (docs/ios.md, "The phone check in a virtual Mac"). Unset, the
    # job runs exactly as before.
    runs-on: ${{ vars.PHONE_VIRTUAL_MAC && 'mini-mac-vm' || vars.MAC_RUNNER || 'mini-mac' }}
    # Reading the pull request's latest version and cancelling this run, if replaced.
    permissions:
      actions: write
      contents: read
      pull-requests: read
    # Only phone jobs queue here. Desktop jobs from other PRs remain parallel.
    # The command leases below let a phone take its turn after active journeys.
    # In the virtual Mac this queue alone keeps one phone clone at a time.
    concurrency:
      group: mac-mini-phone
      queue: max
      cancel-in-progress: false
    # Allow 45 minutes for both native gates, 105 across admission waits
    # (60 behind active desktop journeys plus two local phone gates of about
    # 22 minutes each, ahead through the entry lock), and 15 for setup, cleanup
    # and upload. Test deadlines remain unchanged.
    timeout-minutes: 165
    env:
      PHONE_VIRTUAL_MAC: ${{ vars.PHONE_VIRTUAL_MAC }}
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      - name: Checkout the keep-awake action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/keep-mac-awake
          fetch-depth: 1
          persist-credentials: false
      - name: Keep the Mac awake
        uses: ./.github/actions/keep-mac-awake
      - uses: actions/checkout@v4
        with:
          path: Application Support/firstmate
          persist-credentials: false
      # In the virtual Mac the packages install inside the clone, so this Mac
      # needs only Node for the replacement checks.
      - uses: pnpm/action-setup@v4
        if: ${{ !vars.PHONE_VIRTUAL_MAC }}
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: Application Support/firstmate/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !vars.PHONE_VIRTUAL_MAC && 'pnpm' || '' }}
          cache-dependency-path: Application Support/firstmate/pnpm-lock.yaml
      - name: Install without reading this Mac's signing material
        if: ${{ !vars.PHONE_VIRTUAL_MAC }}
        run: |
          store="$(pnpm store path --silent)"
          install_home="$RUNNER_TEMP/phone-install-home"
          mkdir -p "$install_home"
          HOME="$install_home" CFFIXED_USER_HOME="$install_home" \
            INFINITARY_LOCAL_CODESIGN_DIR="$install_home/local-codesign" \
            pnpm install --frozen-lockfile --store-dir "$store"
      # The clone has no simulator until a device gate starts, and the last step
      # deletes it however the job ends, a replaced version's included.
      - id: vm
        name: Start a fresh virtual Mac
        if: ${{ vars.PHONE_VIRTUAL_MAC }}
        run: scripts/virtual-mac/phone.sh start "$RUNNER_TEMP/phone"
      # No simulator exists before a device gate. A rerun of a replaced version has no
      # newer run to cancel it, so it stops here. A failed reading runs the gate.
      - id: start
        name: Stop before the gates if a newer push replaced this version
        continue-on-error: true
        run: node scripts/replaced-phone-runs.ts stop-if-replaced
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # test-phone owns a fresh HOME, real fixture and simulator, and disables signing.
      # It checks generated files, Swift trust, native recovery and the published client.
      # In the virtual Mac it takes no lease: phone checks wait only for each other.
      # PHONE_VIRTUAL_MAC=together runs both devices at once instead (INF-517's trial).
      - id: iphone
        name: Read and recover on iPhone
        if: ${{ steps.start.outputs.replaced != 'true' && vars.PHONE_VIRTUAL_MAC != 'together' }}
        run: |
          if [ -n "$PHONE_VIRTUAL_MAC" ]; then exec scripts/virtual-mac/phone.sh gate iphone; fi
          python3 scripts/with-mac-check.py exclusive "$HOME/Library/Caches/infinitary-ci/checks.lock" -- node scripts/test-phone.ts --evidence "$RUNNER_TEMP/phone/iphone"
      # No simulator exists between the gates. A failed reading runs the iPad gate.
      - id: current
        name: Stop before the iPad if a newer push replaced this version
        if: ${{ !cancelled() && steps.iphone.outcome != 'skipped' }}
        continue-on-error: true
        run: node scripts/replaced-phone-runs.ts stop-if-replaced
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: ipad
        name: Read and recover on iPad
        if: ${{ !cancelled() && steps.iphone.outcome != 'skipped' && steps.current.outputs.replaced != 'true' }}
        run: |
          if [ -n "$PHONE_VIRTUAL_MAC" ]; then exec scripts/virtual-mac/phone.sh gate ipad; fi
          python3 scripts/with-mac-check.py exclusive "$HOME/Library/Caches/infinitary-ci/checks.lock" -- node scripts/test-phone.ts --ipad --evidence "$RUNNER_TEMP/phone/ipad"
      - id: both
        name: Read and recover on iPhone and iPad at once
        if: ${{ vars.PHONE_VIRTUAL_MAC == 'together' && steps.start.outputs.replaced != 'true' }}
        run: scripts/virtual-mac/phone.sh gate iphone ipad
      - name: Delete the virtual Mac
        if: ${{ always() && steps.vm.outcome != 'skipped' }}
        run: scripts/virtual-mac/phone.sh delete
      - name: Keep native results and connection readings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-results
          path: ${{ runner.temp }}/phone/
          if-no-files-found: ignore
          retention-days: 14
