name: phone

# INF-2202: unsigned phone checks run only on the configured vBoxx phone queue.
# Keep an explicit skipped job on unrelated PRs instead of a path-filtered missing check.
# INF-663 (captain: "add a nightly phone check"): a default request on a branch
# runs both device gates whatever changed, with no release step.
# INF-2139 (captain: "let's pull journeys and phone checks off PRs now"): a pull
# request no longer starts this workflow; its pull_request branches stay unused.
# INF-2492: main.yml no longer calls it; ios-release.yml calls it at its resolved
# source, which runs every part of both device gates, as a default request does.
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact resolved source for unsigned release checks; empty uses the caller source
        type: string
        default: ''
      # ios-release.yml sets it, so a release's Linux job runs on GitHub's hosted
      # Ubuntu (docs/testing.md, "A release's hosted machines"); a request keeps the gate label.
      hosted:
        description: Run the Linux job on GitHub's hosted Ubuntu, whatever LINUX_RUNNER says
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      affected:
        description: Run only parts touched by this branch (unknown scope runs all)
        type: boolean
        default: false
      base:
        description: Comparison ref for affected requests
        type: string
        default: origin/main
      parts:
        description: Parts to run, separated by spaces (empty runs all)
        type: string
      starve:
        description: Reproduce scheduling starvation on each part's owned descendants
        type: boolean
        default: false
      waits:
        description: Run only native wait-clock tests, without product journeys
        type: boolean
        default: false
      perf:
        description: Hold native waits to their wall budgets on a quiet run
        type: boolean
        default: false
      recording:
        description: "Capture the existing simulator journeys as silent demo recordings"
        required: false
        type: boolean
        default: false
      guest_observer:
        description: "Observe the cards launch in a separate guest process without changing the journey"
        type: boolean
        default: false
      evidence_run:
        description: "Export native scene attachments from an existing phone run without starting simulators"
        required: false
        type: string

permissions:
  contents: read

# INF-487: no run-level group for the pull request. A run that counts as running
# while its native job waits for a phone guest would hold the newer version behind
# it for hours. cancel-replaced cancels the older runs of this pull request whose
# native job has not started its device gate, and a replaced version ends its own
# run before that gate, a manual rerun of an older version included. INF-895: so
# does a run whose pull request merged or closed while it waited in the phone line.
# A started gate is never cancelled: it deletes its own simulators.

jobs:
  cancel-replaced:
    # The PC's gate label (docs/testing.md, DOP-157): its runners take only gate jobs.
    # Called from a release, GitHub's hosted Ubuntu.
    runs-on: ${{ inputs.hosted && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').light_gate || vars.LINUX_RUNNER && format('{0}-gate', vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          sparse-checkout: |
            package.json
            scripts/replaced-phone-runs.ts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cancel this pull request's older phone runs
        run: node scripts/replaced-phone-runs.ts cancel-older
        env:
          GITHUB_TOKEN: ${{ github.token }}
  native-phone:
    name: ${{ inputs.evidence_run != '' && 'native-phone-not-requested' || 'native-phone' }}
    if: inputs.evidence_run == ''
    # Required: no override or local fallback. The fleet serves this label only
    # from the two vBoxx VMs; a missing mapping supplies no runnable destination.
    runs-on: ${{ fromJSON(vars.MAC_QUEUES).phone }}
    # Reading the pull request's latest version and cancelling this run, if replaced, and
    # main's newest passing check of every part for its part times (INF-827).
    permissions:
      actions: write
      contents: read
      pull-requests: read
    # Each run and attempt waits only for a free vBoxx place, not another run's group.
    concurrency:
      group: ${{ format('phone-{0}-{1}', github.run_id, github.run_attempt) }}
      queue: max
      cancel-in-progress: false
    # Retain the job limit for setup, checks, cleanup and evidence upload.
    # Commands run directly; the device gate has its own 90-minute limit on every route.
    timeout-minutes: 165
    outputs:
      repeat_parts: ${{ steps.request-select.outputs.repeat_parts }}
    env:
      PHONE_ROUND: ''
      PHONE_REPEAT_PARTS: ''
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps: &phone-steps
      - name: Checkout the keep-awake action
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          sparse-checkout: .github/actions/keep-mac-awake
          fetch-depth: 1
          persist-credentials: false
      - name: Keep the Mac awake
        uses: ./.github/actions/keep-mac-awake
      # INF-2125 P1: this job chooses its own parts, so no PC job stands before it. A pull
      # request's version is its merge into the base branch, whose first parent is that
      # branch, so two commits hold the whole comparison; an affected request compares with
      # its base and reads the whole history.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          path: Application Support/firstmate
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || github.event_name == 'workflow_dispatch' && '0' || '1' }}
          persist-credentials: false
      # No package cache on a Mac (journeys.yml says why, INF-724).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # INF-827 (the captain's approved INF-828 plan): each part's minutes come from the newest
      # passing check of main run on request, such as the nightly one. With none readable, the
      # chooser runs every part the change reaches and says why.
      # INF-1346: only a full gate writes part-times.json, so a passing check of some parts is
      # passed over for the newest passing one whose phone-logs holds it.
      - id: timing-run
        name: Find the newest passing check of main with part times
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // The names in a zip archive, read from its central directory.
            const names = (zip) => {
              const end = zip.lastIndexOf(Buffer.from([0x50, 0x4b, 0x05, 0x06]));
              if (end < 0) return [];
              const found = [];
              let at = zip.readUInt32LE(end + 16);
              for (let entry = 0; entry < zip.readUInt16LE(end + 10) && zip.readUInt32LE(at) === 0x02014b50; entry++) {
                const length = zip.readUInt16LE(at + 28);
                found.push(zip.toString('utf8', at + 46, at + 46 + length));
                at += 46 + length + zip.readUInt16LE(at + 30) + zip.readUInt16LE(at + 32);
              }
              return found;
            };
            const pages = github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'phone.yml', branch: 'main', event: 'workflow_dispatch', per_page: 100
            });
            for await (const { data } of pages) {
              for (const run of data.filter(candidate => candidate.conclusion === 'success')) {
                const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo, run_id: run.id, name: 'phone-logs'
                });
                const logs = artifacts.find(artifact => !artifact.expired);
                if (!logs) continue;
                const { data: zip } = await github.rest.actions.downloadArtifact({
                  ...context.repo, artifact_id: logs.id, archive_format: 'zip'
                });
                if (!names(Buffer.from(zip)).includes('part-times.json')) continue;
                core.setOutput('id', run.id);
                await core.summary.addRaw(`Part times: [passing phone run ${run.id}](${run.html_url})\n`).write();
                return;
              }
            }
      - name: Read that check's part times
        if: steps.timing-run.outputs.id
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-logs
          run-id: ${{ steps.timing-run.outputs.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/phone-times
      - id: select
        name: Check the phone gate's inputs and choose its parts
        if: github.event_name == 'pull_request'
        run: node scripts/affected-phone.ts --base HEAD^1 --head HEAD --times "$RUNNER_TEMP/phone-times/part-times.json" --placement "$RUNNER_TEMP/phone-placement.json" >> "$GITHUB_OUTPUT"
      - id: request-select
        name: Choose affected parts for a crewmate request
        if: github.event_name == 'workflow_dispatch' && !inputs.source_commit && !env.PHONE_REPEAT_PARTS && !inputs.parts && !inputs.waits && inputs.evidence_run == ''
        run: |
          coverage=(); if [ "$AFFECTED" != true ] || [ -n "$REQUESTED_PARTS" ]; then coverage=(--coverage "$REQUESTED_PARTS"); fi
          node scripts/affected-phone.ts --request --base "$BASE_REF" --head HEAD "${coverage[@]}" --placement "$RUNNER_TEMP/phone-placement.json" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ inputs.base || 'origin/main' }}
          AFFECTED: ${{ inputs.affected }}
          REQUESTED_PARTS: ${{ inputs.parts }}
      - id: repeat-select
        name: Reuse the ordinary pass's edited-part selection
        if: env.PHONE_REPEAT_PARTS != ''
        run: echo "parts=$PHONE_REPEAT_PARTS" >> "$GITHUB_OUTPUT"
      - name: Keep the chosen and left parts
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !env.PHONE_ROUND
        uses: actions/upload-artifact@v4
        with:
          name: phone-placement
          path: ${{ runner.temp }}/phone-placement.json
          if-no-files-found: ignore
          retention-days: 14
      # INF-2125 P1: with the chooser in this job, a job it keeps no part for ends here: a pull
      # request whose phone inputs changed only the contract's version line, or an affected
      # request that touched no part.
      - id: scope
        name: Decide whether the device gate runs
        run: echo "gate=$GATE" >> "$GITHUB_OUTPUT"
        env:
          GATE: ${{ steps.repeat-select.outputs.parts != '' || (github.event_name != 'pull_request' || steps.select.outputs.run == 'true') && (!inputs.affected || inputs.parts != '' || steps.request-select.outputs.parts != '') }}
      # Install directly in the placed guest, never in a nested local clone.
      - uses: pnpm/action-setup@v4
        if: ${{ steps.scope.outputs.gate == 'true' }}
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: Application Support/firstmate/package.json
      - name: Install without reading this Mac's signing material
        if: ${{ steps.scope.outputs.gate == 'true' }}
        run: |
          store="$(pnpm store path --silent)"
          install_home="$RUNNER_TEMP/phone-install-home"
          mkdir -p "$install_home"
          HOME="$install_home" CFFIXED_USER_HOME="$install_home" \
            INFINITARY_LOCAL_CODESIGN_DIR="$install_home/local-codesign" \
            pnpm install --frozen-lockfile --store-dir "$store"
      # INF-2125 piece 3: the Swift packages' repositories, which the package tests and the app build
      # fetch. Only main saves them, since a pull request reads its base branch's saves and never another
      # pull request's (INF-724); a changed lockfile restores main's newest and fetches the rest.
      - id: swift-packages
        name: Restore main's Swift packages
        if: ${{ steps.scope.outputs.gate == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swift-packages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Application Support/firstmate/ios/Infinitary/InfinitaryKit/Package.resolved', 'Application Support/firstmate/ios/Infinitary/Infinitary.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swift-packages-${{ runner.os }}-${{ runner.arch }}-
      # No simulator exists before a device gate. A rerun of a replaced version, and the
      # run of a pull request that merged or closed, has no newer run to cancel it, so it
      # stops here (INF-895). A failed reading runs the gate.
      - id: start
        name: Stop before the gates if a newer push replaced this version or the pull request closed
        if: steps.scope.outputs.gate == 'true'
        continue-on-error: true
        run: node scripts/replaced-phone-runs.ts stop-if-replaced
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # test-phone owns a fresh HOME, real fixture and simulators, and disables signing.
      # It checks Swift trust, native recovery and the published client; pnpm check checks generated files.
      # INF-662: one gate checks and builds once, each device on one simulator it starts
      # once (INF-1438) and each part on its own test home; either failing fails it.
      # INF-2101: each vBoxx guest runs one device at a time, deleting its simulator
      # before starting the next. Main and release calls run every part; affected
      # requests use reached parts, with edited-test parts in two following jobs.
      # INF-1343: on a pull request the first failed part stops the others, so a failing check frees
      # its Mac at once; full branch selections also stop early. Main retains full discovery.
      # INF-2052 (the captain's choice "Raise the limit for running the parts from 60 to 90 minutes"):
      # a full check with the Mac mini to itself passed in 59 minutes before INF-2052's other changes;
      # two full checks at once, one per virtual Mac, starved each other past their parts' 20-minute
      # allowances, one of them past these 90 minutes too (runs 41236951239 and 41236954773).
      - id: both
        name: Read and recover on iPhone and iPad
        timeout-minutes: 90
        if: ${{ steps.scope.outputs.gate == 'true' && steps.start.outputs.replaced != 'true' }}
        run: |
          parts=(); for part in $PHONE_PARTS; do parts+=(--part "$part"); done
          if [ "$PHONE_FULL" = true ] && [ -z "$PHONE_REPEAT_PARTS" ]; then parts=(); fi
          node scripts/test-phone.ts --both "${parts[@]}" --simulators 1 --evidence "$RUNNER_TEMP/phone"
        env:
          PHONE_FULL: ${{ steps.request-select.outputs.full }}
          PHONE_PARTS: ${{ steps.repeat-select.outputs.parts || inputs.parts || steps.select.outputs.parts || steps.request-select.outputs.parts }}
          INFINITARY_PHONE_WAITS_ONLY: ${{ inputs.waits && '1' || '0' }}
          INFINITARY_STARVE_CHECK: ${{ inputs.starve && '1' || '0' }}
          INFINITARY_PERF_BUDGETS: ${{ inputs.perf && '1' || '0' }}
          PHONE_RECORDING: ${{ inputs.recording && '1' || '' }}
          INFINITARY_PHONE_GUEST_OBSERVER: ${{ inputs.guest_observer && '1' || '0' }}
          INFINITARY_PHONE_STOP_EARLY: ${{ (github.event_name == 'pull_request' || steps.request-select.outputs.full == 'true' || steps.repeat-select.outputs.parts != '') && '1' || '0' }}
          INFINITARY_PHONE_PACKAGE_CACHE: ${{ runner.temp }}/swift-packages
      - name: Save the Swift packages for pull requests
        # The gate fetched them once it started, passing or failing; a save that fails never fails main's check.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.swift-packages.outputs.cache-hit != 'true' && (steps.both.outcome == 'success' || steps.both.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swift-packages
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}
      # Keep diagnostics independently of screenshot-heavy xcresult bundles,
      # so a failed gate can be diagnosed within the workflow reader's limits.
      # A full gate's part times ride along for the pull requests' chooser (INF-827).
      # INF-2053: each part's live simulator log (tests/helpers/phoneLogs.ts) runs to tens of
      # megabytes, and a full gate's twelve took these logs past the app's 64 MiB artifact
      # download; they are kept whole in an artifact of their own below.
      - name: Keep the small native command logs
        if: always() && !env.PHONE_ROUND
        uses: actions/upload-artifact@v4
        with:
          name: phone-logs
          path: |
            ${{ runner.temp }}/phone/**/*.log
            ${{ runner.temp }}/phone/part-times.json
            !${{ runner.temp }}/phone/**/simulator-live.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep the simulator logs as their own artifact
        if: always() && !env.PHONE_ROUND
        uses: actions/upload-artifact@v4
        with:
          name: phone-simulator-logs
          path: ${{ runner.temp }}/phone/**/simulator-live.log
          if-no-files-found: ignore
          retention-days: 3
      # INF-1062: the pictures alone, exported from each result bundle with the names the
      # journeys gave them, so a crewmate reads the gate's pictures within the app's artifact
      # limit; phone-results, with every bundle whole, has outgrown it.
      - name: Keep the pictures
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/phone" ] || exit 0
          out="$RUNNER_TEMP/phone-pictures"
          while IFS= read -r bundle; do
            part="${bundle#"$RUNNER_TEMP/phone/"}"; part="${part%/phone.xcresult}"
            mkdir -p "$out/$part"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$out/$part" \
              || echo "No pictures exported from $bundle"
          done < <(find "$RUNNER_TEMP/phone" -type d -name phone.xcresult)
      - name: Keep the pictures as their own artifact
        if: always() && !env.PHONE_ROUND
        uses: actions/upload-artifact@v4
        with:
          name: phone-pictures
          path: ${{ runner.temp }}/phone-pictures
          if-no-files-found: ignore
          retention-days: 3
      # INF-1343 (the captain's "Upload the 530 MB phone results only when a check fails"): the whole
      # result bundles are for diagnosing a failure; a recording run keeps them for its clips, which
      # the evidence_run export reads. The logs and pictures above stay on every run. A failure's
      # bundles are kept 1 day, a recording run's 3 days for its export.
      - name: Keep native results and connection readings
        if: (failure() || inputs.recording) && !env.PHONE_ROUND
        uses: actions/upload-artifact@v4
        with:
          name: phone-results
          path: ${{ runner.temp }}/phone/
          if-no-files-found: ignore
          retention-days: ${{ inputs.recording && 3 || 1 }}
      - name: Keep each additional pass's evidence
        if: always() && env.PHONE_ROUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: phone-repeat${{ env.PHONE_ROUND }}
          path: |
            ${{ runner.temp }}/phone/**/*.log
            ${{ runner.temp }}/phone/part-times.json
            ${{ runner.temp }}/phone-pictures/
            !${{ runner.temp }}/phone/**/simulator-live.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep each additional pass's simulator logs
        if: always() && env.PHONE_ROUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: phone-repeat${{ env.PHONE_ROUND }}-simulator-logs
          path: ${{ runner.temp }}/phone/**/simulator-live.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep each additional pass's failure results
        if: (failure() || inputs.recording) && env.PHONE_ROUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: phone-repeat${{ env.PHONE_ROUND }}-results
          path: ${{ runner.temp }}/phone/
          if-no-files-found: ignore
          retention-days: ${{ inputs.recording && 3 || 1 }}
  # INF-2259: one ordinary pass plus two edited-part passes. Each successful
  # predecessor releases its simulators before the next job starts. No retries.
  phone-repeat-2:
    needs: [native-phone]
    if: needs.native-phone.outputs.repeat_parts != ''
    runs-on: ${{ fromJSON(vars.MAC_QUEUES).phone }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: ${{ format('phone-{0}-{1}', github.run_id, github.run_attempt) }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 165
    env:
      PHONE_ROUND: '-2'
      PHONE_REPEAT_PARTS: ${{ needs.native-phone.outputs.repeat_parts }}
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps: *phone-steps
  phone-repeat-3:
    needs: [native-phone, phone-repeat-2]
    if: needs.native-phone.outputs.repeat_parts != ''
    runs-on: ${{ fromJSON(vars.MAC_QUEUES).phone }}
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: ${{ format('phone-{0}-{1}', github.run_id, github.run_attempt) }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 165
    env:
      PHONE_ROUND: '-3'
      PHONE_REPEAT_PARTS: ${{ needs.native-phone.outputs.repeat_parts }}
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps: *phone-steps
  # INF-1066: result bundles can exceed the workflow reader's download bound.
  # Export selected evidence on the Xcode host without a simulator, build, sign-in or signing.
  scene-evidence:
    if: inputs.evidence_run != ''
    runs-on: ${{ fromJSON(vars.MAC_QUEUES || '{}').light || vars.MAC_RUNNER || 'mini-mac' }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phone-results
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scene-source
      - name: Export native scene attachments
        env:
          SOURCE: ${{ runner.temp }}/scene-source
          DEST: ${{ runner.temp }}/scene-evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          source, dest = pathlib.Path(os.environ['SOURCE']), pathlib.Path(os.environ['DEST'])
          dest.mkdir(parents=True, exist_ok=True)
          for bundle in source.rglob('*.xcresult'):
              part = bundle.parent.name
              if part not in ('rest', 'character'):
                  continue
              device = bundle.parent.parent.name
              exported = source / ('exported-' + device + '-' + part)
              subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(bundle), '--output-path', str(exported)], check=True)
              manifest = json.loads((exported / 'manifest.json').read_text())
              def keep(value):
                  if isinstance(value, list):
                      for child in value: keep(child)
                  elif isinstance(value, dict):
                      file = value.get('exportedFileName')
                      name = value.get('suggestedHumanReadableName', '')
                      if file and name.startswith('native-scene-'):
                          src = exported / pathlib.Path(file).name
                          shutil.copyfile(src, dest / (device + '-' + part + '-' + pathlib.Path(name).stem + '-' + src.name))
                      for child in value.values():
                          if isinstance(child, (dict, list)): keep(child)
              keep(manifest)
              shutil.copyfile(exported / 'manifest.json', dest / (device + '-' + part + '-manifest.json'))
          for clip in source.rglob('*.mp4'):
              if clip.stem.removesuffix('-raw') not in ('native-scene-pan', 'native-scene-keyboard', 'conversation', 'character'):
                  continue
              device, part = clip.parent.parent.name, clip.parent.name
              shutil.copyfile(clip, dest / (device + '-' + part + '-' + clip.name))
              poster = clip.with_name(clip.stem + '-poster.png')
              if poster.exists(): shutil.copyfile(poster, dest / (device + '-' + part + '-' + poster.name))
          shutil.rmtree(source)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-scene-evidence
          path: ${{ runner.temp }}/scene-evidence
          retention-days: 14
          if-no-files-found: error
