name: phone

# INF-2202: unsigned phone checks run only on the configured vBoxx phone queue.
# INF-663 (captain: "add a nightly phone check"): a default request on a branch
# runs both device gates whatever changed, with no release step.
# INF-2139 (captain: "let's pull journeys and phone checks off PRs now"): a pull
# request no longer starts this workflow, and INF-2539 removed its pull-request
# paths: the part chooser with its part-times lookup and the replaced-run checks.
# INF-2492: main.yml no longer calls it; ios-release.yml calls it at its resolved
# source, which runs every part of both device gates, as a default request does.
# INF-2582 direction A (the captain's "A: wait once and trim the soak" and "iPhone only;
# iPad waits for the release check"): one job runs all three passes of a request, a branch
# runs 2 of the 20 relaunch pairs and its reached parts on the iPhone alone, and the phone
# release calls this once per device, so each device takes its own phone Mac.
on:
  workflow_call:
    inputs:
      trigger:
        description: What started the caller's run, which every job name here leads with (scripts/ci-job-names.mjs)
        type: string
        default: ''
      source_commit:
        description: Exact resolved source for unsigned release checks; empty uses the caller source
        type: string
        default: ''
      device:
        description: The one device this call checks, ipad or iphone; empty checks both
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      affected:
        description: Run only parts touched by this branch (unknown scope runs all)
        type: boolean
        default: false
      base:
        description: Comparison ref for affected requests
        type: string
        default: origin/main
      parts:
        description: Parts to run, separated by spaces (empty runs all)
        type: string
      starve:
        description: Reproduce scheduling starvation on each part's owned descendants
        type: boolean
        default: false
      waits:
        description: Run only native wait-clock tests, without product journeys
        type: boolean
        default: false
      perf:
        description: Hold native waits to their wall budgets on a quiet run
        type: boolean
        default: false
      recording:
        description: "Capture the existing simulator journeys as silent demo recordings"
        required: false
        type: boolean
        default: false
      guest_observer:
        description: "Observe the cards launch in a separate guest process without changing the journey"
        type: boolean
        default: false
      evidence_run:
        description: "Export native scene attachments from an existing phone run without starting simulators"
        required: false
        type: string
      task:
        description: Requesting task (required for every part on a branch)
        type: string
      reason:
        description: Why this branch needs every part, not its touched or named parts (required for every part on a branch)
        type: string

permissions:
  contents: read

# INF-487: no run-level group. A run that counts as running while its native
# job waits for a phone guest would hold every later run behind it for hours;
# each run and attempt waits only for a free guest.

jobs:
  # INF-2576 (the captain's choice "A, write the rules and add the phone workflow guard"): a
  # request on a branch that would run every part names its task and reason, as a full Linux
  # sweep does, and is refused on a light Linux machine before it waits for a phone guest
  # (docs/testing.md, "What a task branch requests"). A call and every narrower request pass.
  request:
    name: ${{ format('{0} · Check phone check request', inputs.trigger || 'Manual request') }}
    # The phone release's call, which passes its resolved source, runs it on GitHub's hosted Ubuntu.
    runs-on: ${{ inputs.source_commit != '' && 'ubuntu-24.04' || fromJSON(vars.LINUX_QUEUES || '{}').light || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Validate and record the manual phone request
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.evidence_run == '' }}
          BRANCH: ${{ github.ref != 'refs/heads/main' }}
          EVERY_PART: ${{ !inputs.affected && inputs.parts == '' && !inputs.waits }}
          AFFECTED: ${{ inputs.affected }}
          PARTS: ${{ inputs.parts }}
          TASK: ${{ inputs.task }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$MANUAL" != true ]; then exit 0; fi
          if [ "$BRANCH" = true ] && [ "$EVERY_PART" = true ]; then
            [ -n "$TASK" ] && [ -n "$REASON" ] || {
              echo 'A branch request for every phone part requires a task and reason; send affected "true" or name parts instead'; exit 1;
            }
          fi
          printf 'Phone request: every_part=%s affected=%s parts=%s task=%s reason=%s\n' "$EVERY_PART" "$AFFECTED" "$PARTS" "$TASK" "$REASON" >> "$GITHUB_STEP_SUMMARY"
  # Each job's name leads with the caller's trigger (scripts/ci-job-names.mjs).
  native-phone:
    needs: request
    name: ${{ inputs.evidence_run != '' && 'Manual request · Phone checks not requested' || format(inputs.waits && '{0} · Wait-clock tests (iPhone and iPad)' || '{0} · Phone checks ({1})', inputs.trigger || 'Manual request', inputs.device == 'ipad' && 'iPad' || inputs.device == 'iphone' && 'iPhone' || 'iPhone and iPad') }}
    if: inputs.evidence_run == ''
    # Required: no override or local fallback. The fleet serves this label only
    # from the two vBoxx VMs; a missing mapping supplies no runnable destination.
    runs-on: ${{ fromJSON(vars.MAC_QUEUES).phone }}
    # Each run, attempt and device waits only for a free vBoxx place, not another run's group.
    concurrency:
      group: ${{ format('phone-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.device) }}
      queue: max
      cancel-in-progress: false
    # Retain the job limit for setup, checks, cleanup and evidence upload: 165 minutes for the
    # ordinary pass, and 90 more for each of the two edited-part passes, which ran as jobs of
    # 165 minutes each before INF-2582. The device gate has its own limit, 90 minutes a pass.
    timeout-minutes: 345
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      - name: Checkout the keep-awake action
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          sparse-checkout: .github/actions/keep-mac-awake
          fetch-depth: 1
          persist-credentials: false
      - name: Keep the Mac awake
        uses: ./.github/actions/keep-mac-awake
      # INF-2125 P1: this job chooses its own parts, so no PC job stands before it. An
      # affected request compares with its base and reads the whole history; a call checks
      # out its resolved source alone.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          path: Application Support/firstmate
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          persist-credentials: false
      # No package cache on a Mac (journeys.yml says why, INF-724).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: request-select
        name: Choose affected parts for a crewmate request
        if: github.event_name == 'workflow_dispatch' && !inputs.source_commit && !inputs.parts && !inputs.waits && inputs.evidence_run == ''
        run: |
          coverage=(); if [ "$AFFECTED" != true ] || [ -n "$REQUESTED_PARTS" ]; then coverage=(--coverage "$REQUESTED_PARTS"); fi
          node scripts/affected-phone.ts --request --base "$BASE_REF" --head HEAD "${coverage[@]}" --placement "$RUNNER_TEMP/phone-placement.json" >> "$GITHUB_OUTPUT"
        env:
          BASE_REF: ${{ inputs.base || 'origin/main' }}
          AFFECTED: ${{ inputs.affected }}
          REQUESTED_PARTS: ${{ inputs.parts }}
      - name: Keep the chosen and left parts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: phone-placement
          path: ${{ runner.temp }}/phone-placement.json
          if-no-files-found: ignore
          retention-days: 14
      # INF-2125 P1: with the chooser in this job, a job it keeps no part for ends here: an
      # affected request that touched no part.
      - id: scope
        name: Decide whether the device gate runs
        run: echo "gate=$GATE" >> "$GITHUB_OUTPUT"
        env:
          GATE: ${{ !inputs.affected || inputs.parts != '' || steps.request-select.outputs.parts != '' }}
      # Install directly in the placed guest, never in a nested local clone.
      - uses: pnpm/action-setup@v4
        if: ${{ steps.scope.outputs.gate == 'true' }}
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          package_json_file: Application Support/firstmate/package.json
      - name: Install without reading this Mac's signing material
        if: ${{ steps.scope.outputs.gate == 'true' }}
        run: |
          store="$(pnpm store path --silent)"
          install_home="$RUNNER_TEMP/phone-install-home"
          mkdir -p "$install_home"
          HOME="$install_home" CFFIXED_USER_HOME="$install_home" \
            INFINITARY_LOCAL_CODESIGN_DIR="$install_home/local-codesign" \
            pnpm install --frozen-lockfile --store-dir "$store"
      # INF-2125 piece 3: the Swift packages' repositories, which the package tests and the app build
      # fetch. Only main saves them, since a run on a branch reads main's saves and never another
      # branch's (INF-724); a changed lockfile restores main's newest and fetches the rest.
      - id: swift-packages
        name: Restore main's Swift packages
        if: ${{ steps.scope.outputs.gate == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swift-packages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Application Support/firstmate/ios/Infinitary/InfinitaryKit/Package.resolved', 'Application Support/firstmate/ios/Infinitary/Infinitary.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swift-packages-${{ runner.os }}-${{ runner.arch }}-
      # test-phone owns a fresh HOME, real fixture and simulators, and disables signing.
      # It checks Swift trust, native recovery and the published client; pnpm check checks generated files.
      # INF-662: one gate checks and builds once, each device on one simulator it starts
      # once (INF-1438) and each part on its own test home; either failing fails it.
      # INF-2101: each vBoxx guest runs one device at a time, deleting its simulator
      # before starting the next. Release calls run every part; affected requests use
      # reached parts.
      # INF-2582 direction A: on an affected request a part the change only reaches runs on
      # the iPhone alone, and a part whose test code changed runs on both devices, then twice
      # more on the iPhone in this same step (INF-2732), on the build and simulators it started,
      # so the request waits for a phone Mac once, however few parts it selects (INF-2811). Each pass keeps the 90 minutes INF-2052 gave the gate. A request
      # on a branch runs 1 of each relaunch part's 10 pairs; main and the release run all 20.
      # INF-1343: a complete branch selection stops at its first failed part, so a failing check
      # frees its Mac at once, and so does any request with edited-part passes, whose failed pass
      # stops the later ones (INF-2811); other proper-subset requests and the phone release keep
      # full discovery.
      # INF-2052 (the captain's choice "Raise the limit for running the parts from 60 to 90 minutes"):
      # a full check with the Mac mini to itself passed in 59 minutes before INF-2052's other changes;
      # two full checks at once, one per virtual Mac, starved each other past their parts' 20-minute
      # allowances, one of them past these 90 minutes too (runs 41236951239 and 41236954773).
      - id: both
        name: Read and recover on iPhone and iPad
        timeout-minutes: ${{ steps.request-select.outputs.repeat_parts != '' && 270 || 90 }}
        if: ${{ steps.scope.outputs.gate == 'true' }}
        run: |
          parts=()
          for part in $PHONE_PARTS; do
            case " $PHONE_IPHONE_PARTS " in
              *" $part "*) parts+=(--iphone-part "$part") ;;
              *) parts+=(--part "$part") ;;
            esac
          done
          # A complete selection on both devices runs every part, and keeps their times.
          if [ "$PHONE_FULL" = true ] && [ -z "$PHONE_IPHONE_PARTS" ]; then parts=(); fi
          for part in $PHONE_REPEAT_PARTS; do parts+=(--repeat-part "$part"); done
          device=(--both); evidence="$RUNNER_TEMP/phone"
          case "$PHONE_DEVICE" in
            '') ;;
            ipad) device=(--ipad); evidence="$evidence/ipad" ;;
            iphone) device=(); evidence="$evidence/iphone" ;;
            *) echo "Unknown phone device: $PHONE_DEVICE" >&2; exit 1 ;;
          esac
          node scripts/test-phone.ts "${device[@]}" "${parts[@]}" --simulators 1 --evidence "$evidence"
        env:
          PHONE_DEVICE: ${{ inputs.device }}
          PHONE_FULL: ${{ steps.request-select.outputs.full }}
          PHONE_PARTS: ${{ inputs.parts || steps.request-select.outputs.parts }}
          PHONE_IPHONE_PARTS: ${{ steps.request-select.outputs.iphone_parts }}
          PHONE_REPEAT_PARTS: ${{ steps.request-select.outputs.repeat_parts }}
          INFINITARY_PHONE_RELAUNCH_PAIRS: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.source_commit && '1' || '' }}
          INFINITARY_PHONE_WAITS_ONLY: ${{ inputs.waits && '1' || '0' }}
          INFINITARY_STARVE_CHECK: ${{ inputs.starve && '1' || '0' }}
          INFINITARY_PERF_BUDGETS: ${{ inputs.perf && '1' || '0' }}
          PHONE_RECORDING: ${{ inputs.recording && '1' || '' }}
          INFINITARY_PHONE_GUEST_OBSERVER: ${{ inputs.guest_observer && '1' || '0' }}
          INFINITARY_PHONE_STOP_EARLY: ${{ (steps.request-select.outputs.full == 'true' || steps.request-select.outputs.repeat_parts != '') && '1' || '0' }}
          INFINITARY_PHONE_PACKAGE_CACHE: ${{ runner.temp }}/swift-packages
      - name: Save the Swift packages from main
        # The gate fetched them once it started, passing or failing; a save that fails never fails main's check.
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.swift-packages.outputs.cache-hit != 'true' && (steps.both.outcome == 'success' || steps.both.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swift-packages
          key: ${{ steps.swift-packages.outputs.cache-primary-key }}
      # Keep diagnostics independently of screenshot-heavy xcresult bundles,
      # so a failed gate can be diagnosed within the workflow reader's limits.
      # A full gate's part times ride along (part-times.json, scripts/test-phone.ts).
      # INF-2053: each part's live simulator log (tests/helpers/phoneLogs.ts) runs to tens of
      # megabytes, and a full gate's twelve took these logs past the app's 64 MiB artifact
      # download; they are kept whole in an artifact of their own below.
      - name: Keep the small native command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-logs${{ inputs.device && format('-{0}', inputs.device) || '' }}
          path: |
            ${{ runner.temp }}/phone/**/*.log
            ${{ runner.temp }}/phone/**/part-times.json
            !${{ runner.temp }}/phone/**/simulator-live.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep the simulator logs as their own artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-simulator-logs${{ inputs.device && format('-{0}', inputs.device) || '' }}
          path: ${{ runner.temp }}/phone/**/simulator-live.log
          if-no-files-found: ignore
          retention-days: 3
      # INF-1062: the pictures alone, exported from each result bundle with the names the
      # journeys gave them, so a crewmate reads the gate's pictures within the app's artifact
      # limit; phone-results, with every bundle whole, has outgrown it.
      - name: Keep the pictures
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/phone" ] || exit 0
          out="$RUNNER_TEMP/phone-pictures"
          while IFS= read -r bundle; do
            part="${bundle#"$RUNNER_TEMP/phone/"}"; part="${part%/phone.xcresult}"
            mkdir -p "$out/$part"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$out/$part" \
              || echo "No pictures exported from $bundle"
          done < <(find "$RUNNER_TEMP/phone" -type d -name phone.xcresult)
      - name: Keep the pictures as their own artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-pictures${{ inputs.device && format('-{0}', inputs.device) || '' }}
          path: ${{ runner.temp }}/phone-pictures
          if-no-files-found: ignore
          retention-days: 3
      # INF-1343 (the captain's "Upload the 530 MB phone results only when a check fails"): the whole
      # result bundles are for diagnosing a failure; a recording run keeps them for its clips, which
      # the evidence_run export reads. The logs and pictures above stay on every run. A failure's
      # bundles are kept 1 day, a recording run's 3 days for its export.
      - name: Keep native results and connection readings
        if: failure() || inputs.recording
        uses: actions/upload-artifact@v4
        with:
          name: phone-results${{ inputs.device && format('-{0}', inputs.device) || '' }}
          path: ${{ runner.temp }}/phone/
          if-no-files-found: ignore
          retention-days: ${{ inputs.recording && 3 || 1 }}
  # INF-1066: result bundles can exceed the workflow reader's download bound.
  # Export selected evidence on the Xcode host without a simulator, build, sign-in or signing.
  scene-evidence:
    if: inputs.evidence_run != ''
    name: ${{ format('{0} · Export phone pictures', inputs.trigger || 'Manual request') }}
    runs-on: ${{ fromJSON(vars.MAC_QUEUES || '{}').light || vars.MAC_RUNNER || 'mini-mac' }}
    permissions:
      actions: read
      contents: read
    steps:
      # A release run keeps one phone-results per device (INF-2582); a request keeps one.
      - uses: actions/download-artifact@v4
        with:
          pattern: phone-results*
          merge-multiple: true
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/scene-source
      - name: Export native scene attachments
        env:
          SOURCE: ${{ runner.temp }}/scene-source
          DEST: ${{ runner.temp }}/scene-evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          source, dest = pathlib.Path(os.environ['SOURCE']), pathlib.Path(os.environ['DEST'])
          dest.mkdir(parents=True, exist_ok=True)
          for bundle in source.rglob('*.xcresult'):
              part = bundle.parent.name
              if part not in ('rest', 'character'):
                  continue
              device = bundle.parent.parent.name
              exported = source / ('exported-' + device + '-' + part)
              subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(bundle), '--output-path', str(exported)], check=True)
              manifest = json.loads((exported / 'manifest.json').read_text())
              def keep(value):
                  if isinstance(value, list):
                      for child in value: keep(child)
                  elif isinstance(value, dict):
                      file = value.get('exportedFileName')
                      name = value.get('suggestedHumanReadableName', '')
                      if file and name.startswith('native-scene-'):
                          src = exported / pathlib.Path(file).name
                          shutil.copyfile(src, dest / (device + '-' + part + '-' + pathlib.Path(name).stem + '-' + src.name))
                      for child in value.values():
                          if isinstance(child, (dict, list)): keep(child)
              keep(manifest)
              shutil.copyfile(exported / 'manifest.json', dest / (device + '-' + part + '-manifest.json'))
          for clip in source.rglob('*.mp4'):
              if clip.stem.removesuffix('-raw') not in ('native-scene-pan', 'native-scene-keyboard', 'conversation', 'character'):
                  continue
              device, part = clip.parent.parent.name, clip.parent.name
              shutil.copyfile(clip, dest / (device + '-' + part + '-' + clip.name))
              poster = clip.with_name(clip.stem + '-poster.png')
              if poster.exists(): shutil.copyfile(poster, dest / (device + '-' + part + '-' + poster.name))
          shutil.rmtree(source)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-scene-evidence
          path: ${{ runner.temp }}/scene-evidence
          retention-days: 14
          if-no-files-found: error
