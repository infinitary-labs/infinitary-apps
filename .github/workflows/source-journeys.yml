name: Source desktop journeys

# The app built from source on a desktop (docs/testing.md, "The Linux source
# desktop"): a pull request's starter journeys (journeys.yml), and with suite
# full every journey in the suite, split across Linux machines, before every
# alpha and on demand (verify.yml). The run-alone pass runs with the proof of
# edited journeys (suite affected, scripts/journey-runs.ts), never in the full
# suite (INF-2340), and over every spec file only on request (suite alone). Packaging comes later. Every job runs on
# the label the repository variable LINUX_RUNNER names, as ci.yml's do, and
# on GitHub's hosted Ubuntu when it is unset; the PC's job image supplies its
# own pnpm store, so only hosted jobs restore setup-node's cache. A publishing
# release passes its own Linux label as runner (docs/testing.md, "A release's
# Linux label").
on:
  # Linux-only full-suite or fresh-state proof, without Mac or packaging work.
  workflow_dispatch:
    inputs:
      suite:
        description: Full eight-shard Linux suite or four fresh-state shards
        type: choice
        options: [alone, full]
        default: alone
      ref:
        description: Exact source commit (required for full); empty uses the selected ref for alone
        type: string
      task:
        description: Requesting task (required for full)
        type: string
      reason:
        description: Why this Linux sweep is needed (required for full)
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      hosted:
        description: Run on GitHub's hosted Ubuntu, whatever LINUX_RUNNER says (a call from main.yml or release.yml)
        required: false
        type: boolean
        default: false
      artifact-suffix:
        type: string
        default: source
      files:
        description: Space-separated affected journey files
        type: string
        default: ""
      repeat-base:
        description: Nonempty for selected development proof; edited files run three total rounds
        type: string
        default: ""
      lane:
        description: Lane of affected files (parallel or desktop)
        type: string
        default: parallel
      suite:
        description: starter (two lanes), affected (files in one lane, with edited files' run-alone pass), full (eight journey shards), or alone (four run-alone shards)
        required: false
        type: string
        default: starter

jobs:
  source-desktop:
    # Starters split by lane. Affected files keep their lane; the full suite is the parallel
    # lanes and the serial desktop lane, each split four ways, one job a
    # share, so a failure names its own part of the suite; the desktop lane
    # still runs alone on its machine (tests/e2e/lanes.ts). A requested
    # run-alone pass over every spec file splits four ways (docs/testing.md
    # "Each test owns its prerequisites"), each share on a machine of its own.
    name: ${{ (inputs.suite == 'full' || inputs.suite == 'alone') && (matrix.lane == 'alone' && format('journeys (run alone {0}/4)', matrix.shard) || format('journeys ({0} {1}/4)', matrix.lane, matrix.shard)) || format('source-desktop ({0})', matrix.lane) }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.suite == 'alone' && '["alone"]' || (inputs.suite != 'affected' && '["parallel", "desktop"]' || format('["{0}"]', inputs.lane))) }}
        shard: ${{ fromJSON((inputs.suite == 'full' || inputs.suite == 'alone') && '[1, 2, 3, 4]' || '[1]') }}
    runs-on: ${{ inputs.hosted && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: Application Support/firstmate
    steps:
      - name: Record the timing observation start
        working-directory: ${{ runner.temp }}
        run: echo "TIMING_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: Application Support/firstmate
          fetch-depth: 0
      - name: Record the manual Linux request
        if: github.event_name == 'workflow_dispatch' && github.workflow == 'Source desktop journeys'
        env:
          SUITE: ${{ inputs.suite }}
          SOURCE: ${{ inputs.ref }}
          TASK: ${{ inputs.task }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ "$SUITE" = full ]; then
            [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] && [ "$SOURCE" = "$(git rev-parse HEAD)" ] && [ -n "$TASK" ] && [ -n "$REASON" ] || {
              echo 'Full Linux requests require an exact source commit, task and reason'; exit 1;
            }
          fi
          printf 'Linux request: suite=%s source=%s task=%s reason=%s\n' "$SUITE" "$(git rev-parse HEAD)" "$TASK" "$REASON" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Application Support/firstmate/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: Application Support/firstmate/pnpm-lock.yaml
      - name: Install virtual display and desktop libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libgtk-3-0 libnss3 libasound2t64 libgbm1
      - uses: ./Application Support/firstmate/.github/actions/node-headers
      - run: pnpm install --frozen-lockfile
        # Scope Node headers to this install, never to Electron rebuilds.
        env:
          NPM_PACKAGE_CONFIG_NODE_GYP_NODEDIR: ${{ env.INFINITARY_NODE_HEADERS }}
      # An unpacked Electron download has no installer to configure its
      # sandbox helper. Do that only in this disposable Linux job: a hosted
      # machine, or the PC's fresh virtual machine deleted after the job.
      - name: Configure Electron's sandbox helper
        if: runner.os == 'Linux'
        run: |
          sandbox="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          test -f "$sandbox"
          # Chromium parses the helper as a command prefix and splits a
          # helper path containing spaces. The app/checkout stay under
          # Application Support; only this pinned helper gets a plain path.
          helper="$RUNNER_TEMP/firstmate-chrome-sandbox"
          case "$helper" in *' '*) echo 'Sandbox helper path must have no spaces'; exit 1;; esac
          sudo install -o root -g root -m 4755 "$sandbox" "$helper"
          # An adjacent helper wins over CHROME_DEVEL_SANDBOX even when
          # unconfigured. Use Chromium's development fallback instead.
          rm "$sandbox"
          test ! -e "$sandbox"
          echo "CHROME_DEVEL_SANDBOX=$helper" >> "$GITHUB_ENV"
      - name: Choose every resize caller on Mac when its helper changes
        if: runner.os != 'Linux'
        run: |
          : > "$RUNNER_TEMP/resize-callers.txt"
          if [ -n "$PR_BASE" ] && ! git diff --quiet "$PR_BASE" HEAD -- tests/e2e/layout.ts; then
            node scripts/journey-callers.ts tests/e2e/layout.ts resizeWindow,minimumWindowSize > "$RUNNER_TEMP/resize-callers.txt"
            cat "$RUNNER_TEMP/resize-callers.txt"
          fi
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - run: pnpm exec playwright install ffmpeg
      - run: pnpm build
      # Every Linux starter includes devices.spec.ts: device regressions must
      # surface before merge, even without a changed hook or copied sentence.
      # Linux also runs the keyboard journeys, pressing Ctrl where a Mac
      # presses Command (docs/keyboard.md, "Keys on each system"), the task
      # browser's journeys, and the voice journeys with the stand-in model,
      # holding right Ctrl (docs/architecture.md section 8, "Where speech runs").
      # The full suite is every journey: a parallel job runs its share of the
      # styles, renderer and application lanes, a desktop job its share of
      # the serial desktop lane, each with --no-deps so neither lane waits
      # as the other's teardown. The virtual screen holds the largest window
      # a journey asks for. With no window manager the window under the
      # pointer takes the keyboard, so the pointer waits on the screen's last
      # pixel, where no window reaches, and no window gains or loses focus
      # as a journey resizes it. Xvfb runs with -noreset: otherwise it
      # resets as its last client leaves - xdotool, before any app opens -
      # and puts the pointer back at the screen's centre. Every app window
      # opens centred, so a pointer there sits in each one, and parallel
      # journeys' windows opening over one another hand it to the window
      # under test, off what its journey rests on. The step stops unless
      # the pointer is on the last pixel. Affected files end with the run-alone
      # pass over the directly edited ones (scripts/journey-runs.ts), and a
      # requested run-alone job runs each later test of every spec file that
      # shares one app by itself (scripts/e2e-alone.ts); the Mac-only ones
      # skip here and run alone in journeys.yml's Mac job.
      - name: Run the journeys with the sandbox on, and affected resize callers on Mac
        id: journeys
        # A pull request's affected journeys end at 75 minutes and their
        # command at 90 (INF-1083, the captain's check limits, as journeys.yml).
        timeout-minutes: ${{ inputs.suite == 'affected' && 90 || 360 }}
        run: |
          echo "TIMING_TEST_START=$(date +%s)" >> "$GITHUB_ENV"
          on_screen() {
            xvfb-run -a -s "-screen 0 $SCREEN -noreset" sh -c '
              width=${SCREEN%%x*}; height=${SCREEN#*x}; height=${height%%x*}
              x=$((width - 1)); y=$((height - 1))
              xdotool mousemove "$x" "$y"
              at=$(xdotool getmouselocation)
              case "$at" in
                "x:$x y:$y "*) exec "$@" ;;
                *) echo "The pointer is not on the last pixel at $x,$y: $at" >&2; exit 1 ;;
              esac' on-screen "$@"
          }
          if [ "$RUNNER_OS" = Linux ] && [ "$SUITE" = affected ]; then
            test -n "$FILES"
            if [ "$LANE" = desktop ]; then
              on_screen node scripts/journey-runs.ts --base "$REPEAT_BASE" --files "$FILES" --alone-out playwright-report/alone -- --project=desktop
            else
              on_screen node scripts/journey-runs.ts --base "$REPEAT_BASE" --files "$FILES" --alone-out playwright-report/alone -- --project=renderer --project=application
            fi
          elif [ "$RUNNER_OS" = Linux ] && [ "$LANE" = alone ]; then
            on_screen node scripts/e2e-alone.ts --shard "$SHARD/4" --out playwright-report/alone
          elif [ "$RUNNER_OS" = Linux ] && [ "$SUITE" = full ] && [ "$LANE" = parallel ]; then
            on_screen pnpm exec playwright test --no-deps --project=styles --project=renderer --project=application --shard="$SHARD/4"
          elif [ "$RUNNER_OS" = Linux ] && [ "$SUITE" = full ] && [ "$LANE" = desktop ]; then
            on_screen pnpm exec playwright test --no-deps --project=desktop --shard="$SHARD/4"
          elif [ "$RUNNER_OS" = Linux ]; then
            if [ "$LANE" = desktop ]; then
              projects="--project=desktop"
            else
              projects="--project=renderer --project=application"
            fi
            on_screen pnpm exec playwright test --no-deps $projects tests/e2e/source-start.spec.ts tests/e2e/phase0-guardrails.spec.ts tests/e2e/answer-delivery.spec.ts tests/e2e/claude-crew-turn.spec.ts tests/e2e/keyboard-routing.spec.ts tests/e2e/keyboard-regions.spec.ts tests/e2e/task-browser.spec.ts tests/e2e/task-browser-actions.spec.ts tests/e2e/task-browser-diagnostics.spec.ts tests/e2e/task-browser-booking.spec.ts tests/e2e/phase6-voice.spec.ts tests/e2e/voice-prompt-focus.spec.ts tests/e2e/repro-voice-press.spec.ts tests/e2e/devices.spec.ts
          else
            callers="$(cat "$RUNNER_TEMP/resize-callers.txt")"
            pnpm exec playwright test --no-deps tests/e2e/source-start.spec.ts tests/e2e/phase0-guardrails.spec.ts tests/e2e/answer-delivery.spec.ts tests/e2e/claude-crew-turn.spec.ts $callers
          fi
        env:
          INFINITARY_SOURCE_EVIDENCE: ${{ runner.temp }}/source-desktop-evidence
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/source-results.json
          SUITE: ${{ inputs.suite }}
          REPEAT_BASE: ${{ inputs.repeat-base || 'origin/main' }}
          FILES: ${{ inputs.files }}
          INFINITARY_E2E_RUN_MINUTES: ${{ inputs.suite == 'affected' && 75 || '' }}
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          SCREEN: 2560x1600x24
      # Linux runs every test it can (docs/testing.md, "Tests that need a
      # Mac"): a test that skipped here without MAC_ONLY_TAG runs on no pull
      # request's Mac either, so the job fails on it, whether its journeys
      # passed or failed.
      - name: Refuse a test that skipped on Linux without the Mac tag
        if: ${{ !cancelled() && runner.os == 'Linux' && matrix.lane != 'alone' }}
        run: node scripts/untagged-skips.ts playwright-report/source-results.json
      # Run-alone owns a separate per-selection report; do not mistake its last
      # child process for the complete job. Ordinary lanes use their existing JSON.
      # Local reusable workflows share their caller's commit. Keep the exporter
      # at that immutable workflow revision, separate from inputs.ref: a reviewed
      # release candidate can predate this helper. Its cwd and report stay the
      # candidate's, so paths and TIMING_REVISION still describe the tested code.
      - name: Checkout the workflow's timing exporter
        if: always() && runner.os == 'Linux' && matrix.lane != 'alone'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-timing
          sparse-checkout: scripts/journey-timing.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Export compact Linux timing
        if: always() && runner.os == 'Linux' && matrix.lane != 'alone'
        run: |
          export TIMING_REVISION="$(git rev-parse HEAD)"
          node "$GITHUB_WORKSPACE/workflow-timing/scripts/journey-timing.ts" playwright-report/source-results.json "$RUNNER_TEMP/journey-timing.json"
        env:
          SUITE: ${{ inputs.suite }}
          FILES: ${{ inputs.files }}
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
          TEST_OUTCOME: ${{ steps.journeys.outcome }}
      - name: Keep compact Linux timing separately
        if: always() && runner.os == 'Linux' && matrix.lane != 'alone'
        uses: actions/upload-artifact@v4
        with:
          name: journey-timing-${{ runner.os }}-${{ inputs.artifact-suffix }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/journey-timing.json
          if-no-files-found: ignore
          retention-days: 14
      # A run whose journeys did not pass keeps the window and everything the
      # journeys left; a passing run keeps only its result file and any
      # recorded demo, under the same name.
      - name: Keep the Linux window and the journeys' results
        if: always() && steps.journeys.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-desktop-${{ runner.os }}${{ (inputs.suite == 'full' || inputs.suite == 'alone') && format('-{0}-{1}', matrix.lane, matrix.shard) || format('-{0}-{1}', inputs.artifact-suffix, matrix.lane) }}
          path: |
            ${{ runner.temp }}/source-desktop-evidence/
            Application Support/firstmate/playwright-report/source-results.json
            Application Support/firstmate/test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep a passing run's result and demos
        if: always() && steps.journeys.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-desktop-${{ runner.os }}${{ (inputs.suite == 'full' || inputs.suite == 'alone') && format('-{0}-{1}', matrix.lane, matrix.shard) || format('-{0}-{1}', inputs.artifact-suffix, matrix.lane) }}
          path: |
            Application Support/firstmate/playwright-report/source-results.json
            Application Support/firstmate/test-results/runs/*/*/demo/
          if-no-files-found: ignore
          retention-days: 3
      - name: Keep the run-alone result
        if: always() && (matrix.lane == 'alone' || inputs.suite == 'affected')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane == 'alone' && format('e2e-alone-{0}', matrix.shard) || format('e2e-alone-{0}-{1}', inputs.artifact-suffix, matrix.lane) }}
          path: Application Support/firstmate/playwright-report/alone/
          if-no-files-found: ignore
          retention-days: 14
      # The run's page lists the run-alone pass's counts and each test that
      # failed alone, and an affected job's only when it edited a journey that
      # shares one app. A report, never a gate.
      - name: Summarize the run-alone pass
        if: always() && (matrix.lane == 'alone' || inputs.suite == 'affected')
        continue-on-error: true
        run: |
          if [ "$LANE" = alone ] || [ -f playwright-report/alone/alone-results.json ]; then
            node scripts/e2e-alone.ts --summarize playwright-report/alone | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        env:
          LANE: ${{ matrix.lane }}
