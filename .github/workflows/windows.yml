name: windows

# The Windows installer, built and checked (docs/windows.md): one unsigned
# per-user installer for x64 PCs, built on the PC's Windows places, then
# installed on a fresh Windows 11 virtual machine and checked there
# (tests/windows/installed-windows.spec.ts): installed for one person, its
# Start menu entry carrying the app's identity, opened after install the
# way the Start menu opens it, Git for Windows offered and installed on the
# person's yes, the command with no window started through this person's
# Task Scheduler, a crew turn whose commands run in that Git's Git Bash with
# its job stopped, and removal that keeps the saved work. The installer
# stays on the run; nothing here signs or uploads it anywhere else. An
# alpha's upload job publishes the installer this run checked
# (release.yml).
#
# The captain's pick on INF-4243: it runs on each combined batch that
# touches Windows-relevant files (batch-checks.yml, scripts/windows-paths.ts)
# and on every alpha (release.yml), and on request.
#
# An outside contributor's pull request (docs/public-ci.md, "Outside
# contributors") calls it with hosted: the build runs on GitHub's hosted
# Windows and the fresh Windows 11 check waits for the batch, since it needs
# the PC's clean machine.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to package (default - the selected ref)
        required: false
        type: string
      home_link:
        description: A one-use link from a throwaway home on another computer, which the window joins over the network (docs/windows.md, "The checks"); empty skips that step
        required: false
        type: string
        default: ''
      rounds:
        description: How many check rounds to run side by side on the one installer this run builds (default 1)
        required: false
        type: string
        default: '1'
  workflow_call:
    inputs:
      trigger:
        description: What started the caller's run, which every job name here leads with (scripts/ci-job-names.mjs)
        type: string
        default: ''
      ref:
        description: The commit to package
        required: true
        type: string
      version:
        description: A release's logical version, which the installer carries and the app reports; empty for a batch's check
        required: false
        type: string
        default: ''
      hosted:
        description: Build on GitHub's hosted Windows and skip the fresh Windows 11 check (an outside contributor's pull request)
        type: boolean
        default: false
      rounds:
        description: How many check rounds to run side by side on the one installer this run builds (default 1)
        required: false
        type: string
        default: '1'
    outputs:
      sums:
        description: >-
          The installer's line of the build's SHA256SUMS, which a release's
          upload job checks its own download of the windows-installer
          artifact against
        value: ${{ jobs.build.outputs.sums }}

concurrency:
  group: windows-${{ github.workflow == 'windows' && (inputs.ref || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'windows' }}

permissions:
  contents: read

# Git for Windows' portable build, which both jobs put first on their own
# steps' search path, checked by its SHA-256 (the release's own list): the
# job's bash, git and curl are then this one, never whatever the machine
# carries. The PC's Windows places carry Git 2.45.2, whose curl stops a
# plain download with "A libcurl function was given a bad argument" (exit
# 43), and the fresh Windows 11 machine carries no Git at all.
env:
  PORTABLE_GIT: https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/PortableGit-2.56.1-64-bit.7z.exe
  PORTABLE_GIT_SHA256: 9dd04a608ceb5f6ab32a73709e0ecb159d211da71b697c45ff81f6dd0c6b49c7

jobs:
  build:
    name: ${{ format('{0} · Build the Windows installer', (inputs.trigger || 'Manual request')) }}
    # A fresh standard account on the PC's Windows (the placement
    # service's account places), removed when the job ends; GitHub's hosted
    # Windows with hosted.
    runs-on: ${{ inputs.hosted && 'windows-2025' || vars.WINDOWS_RUNNER || 'shell-pc-windows' }}
    timeout-minutes: 45
    # Each job's own group, which a merge batch's stop enters to cancel it
    # once the code checks failed (scripts/batch-stop.mjs); nothing else
    # enters it.
    concurrency:
      group: ${{ format('batch-stop-{0}-{1}-windows-build', github.run_id, github.run_attempt) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      rounds: ${{ steps.rounds.outputs.rounds }}
      # Carried here so a release's upload never trusts a list from the same download.
      sums: ${{ steps.installer.outputs.sums }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Git Bash for the job's own steps
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PortableGit.7z.exe'
          Invoke-WebRequest -Uri $env:PORTABLE_GIT -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() -ne $env:PORTABLE_GIT_SHA256) { throw 'the portable Git download differs from its release' }
          $dir = Join-Path $env:RUNNER_TEMP 'job-git'
          $p = Start-Process $archive -ArgumentList '-y', "-o$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the portable Git unpacked with $($p.ExitCode)" }
          Add-Content $env:GITHUB_PATH (Join-Path $dir 'cmd')
          Add-Content $env:GITHUB_PATH (Join-Path $dir 'bin')
      # A refused checkout waits until GitHub takes the job's token again,
      # then runs once more (docs/testing.md, "GitHub refusing a job's
      # token"); the wait runs in the portable Git's bash with its curl.
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &build-checkout
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        env:
          TOKEN: ${{ github.token }}
        run: &wait-for-token |
          # Asks the address the checkout's fetch reads, with the job's token
          # as the checkout sends it, every 15 seconds for up to 10 minutes,
          # then lets the checkout try once more. A failure GitHub's token
          # did not cause, such as a missing commit, is tried again at once.
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/info/refs?service=git-upload-pack"
          patience="${CHECKOUT_PATIENCE_SECONDS:-600}"
          pause="${CHECKOUT_PAUSE_SECONDS:-15}"
          started=$SECONDS
          while :; do
            # The token reaches curl on its input, never on its command line.
            answer="$(printf 'user = "x-access-token:%s"\n' "$TOKEN" |
              curl --silent --location --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 30 --max-time 60 --config - --url "$url")" || true
            if [[ "$answer" == 2?? ]]; then exit 0; fi
            waited=$((SECONDS - started))
            if ((waited >= patience)); then
              echo "::warning title=GitHub still refuses the job's token::It answered $answer after ${waited}s; the checkout tries once more."
              exit 0
            fi
            echo "GitHub answered $answer to the job's token after ${waited}s; asking again in ${pause}s"
            sleep "$pause"
          done
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *build-checkout
      # pnpm, Electron and electron-builder's tools from the Actions cache, as
      # every other job takes them (docs/testing.md, "pnpm's own download",
      # "Downloads from GitHub's release server"); the portable Git's bash
      # runs their shell steps.
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: ./.github/actions/electron-download
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 20
      - run: pnpm build
        env:
          INFINITARY_RELEASE_VERSION: ${{ inputs.version }}
      # The requested rounds, as the list the check job's matrix reads: the
      # installer below is built once and every round installs that one.
      - id: rounds
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          node -e 'const n = Number(process.env.ROUNDS || "1"); if (!Number.isInteger(n) || n < 1) { console.error("rounds must be a whole number of at least 1, not " + process.env.ROUNDS); process.exit(1); } console.log("rounds=" + JSON.stringify(Array.from({ length: n }, (_, i) => i + 1)))' >> "$GITHUB_OUTPUT"
      - id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: echo "version=${RELEASE_VERSION:-$(node -p 'require("./package.json").version')}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/electron-builder-tools
      # electron-builder reads Electron's zip from the cache the install's
      # download step restored, checked first against Electron's own sums
      # (.github/actions/electron-download/zips.mjs), as the Linux packages do.
      - name: Build the installer
        id: installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node .github/actions/electron-download/zips.mjs win32 x64
          pnpm exec electron-builder --win --config electron-builder.win.yml --publish never \
            -c.extraMetadata.version="$VERSION" \
            -c.electronDownload.cache="$electron_config_cache" -c.electronDownload.isVerifyChecksum=false
          mkdir -p windows-installer
          cp dist/*-setup.exe windows-installer/
          (cd windows-installer && sha256sum *.exe | tee SHA256SUMS)
          [[ "$(wc -l < windows-installer/SHA256SUMS)" -eq 1 ]] || { echo 'expected exactly one installer' >&2; exit 1; }
          echo "sums=$(cat windows-installer/SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: Keep electron-builder's tools
        if: ${{ !cancelled() }}
        uses: ./.github/actions/electron-builder-tools
        with:
          save: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: windows-installer/
          if-no-files-found: error
          retention-days: ${{ inputs.version && 3 || 1 }}

  check:
    name: ${{ format('{0} · Install and run the Windows app (fresh Windows 11{1})', (inputs.trigger || 'Manual request'), (strategy.job-total > 1 && format('; round {0} of {1}', matrix.round, strategy.job-total) || '')) }}
    needs: build
    # The PC's clean machine never takes a hosted run's installer.
    if: ${{ !inputs.hosted }}
    # One virtual machine per round, side by side on the one installer; a
    # failed round never cancels the others, so every round reports.
    strategy:
      fail-fast: false
      matrix:
        round: ${{ fromJSON(needs.build.outputs.rounds) }}
    # A fresh Windows 11 virtual machine on the PC for each check (the
    # captain's pick on INF-4243): a standard person signed in at its
    # desktop, no Git installed, removed when the job ends (docs/windows.md,
    # "The checks").
    runs-on: ${{ vars.WINDOWS_CLEAN_RUNNER || 'shell-pc-win11' }}
    timeout-minutes: 60
    # The batch stop's group for this job, as the build's. A batch runs one
    # round, which keeps the plain name; a later round of a request has its
    # own group, so side-by-side rounds never queue behind each other.
    concurrency:
      group: ${{ format('batch-stop-{0}-{1}-windows-check{2}', github.run_id, github.run_attempt, matrix.round > 1 && format('-round-{0}', matrix.round) || '') }}
    # Windows PowerShell 5.1, the one Windows ships: a fresh Windows 11
    # machine has no PowerShell 7 (pwsh).
    defaults:
      run:
        shell: powershell
    # The job's own git never asks for a sign-in: its checkout keeps no
    # credentials, and a prompt on the machine's desktop (Git for Windows'
    # helper chooser) waits for a press nobody makes. A git step that needs
    # a sign-in fails at once instead of holding the job to its timeout.
    env:
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: never
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
    steps:
      # The guest has no Git for its person, so the app's first launch offers
      # it. The check's own tools need Git Bash, so the job takes Git for
      # Windows' portable build, checked by its SHA-256, into its own temporary
      # folder and onto its own steps' search path only: the app, opened
      # through Explorer, never sees it, and finds no Git in any place it
      # looks (src/core/windowsGit.ts).
      - name: Git Bash for the job's own steps
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'PortableGit.7z.exe'
          Invoke-WebRequest -UseBasicParsing -Uri $env:PORTABLE_GIT -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower() -ne $env:PORTABLE_GIT_SHA256) { throw 'the portable Git download differs from its release' }
          $dir = Join-Path $env:RUNNER_TEMP 'job-git'
          $p = Start-Process $archive -ArgumentList '-y', "-o$dir" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the portable Git unpacked with $($p.ExitCode)" }
          Add-Content $env:GITHUB_PATH (Join-Path $dir 'cmd')
          Add-Content $env:GITHUB_PATH (Join-Path $dir 'bin')
      # A refused checkout waits as the build's does, in the portable Git's
      # bash rather than the job's PowerShell.
      - id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        continue-on-error: true
        with: &check-checkout
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Wait until GitHub takes the job's token
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: *wait-for-token
      - name: Check out again
        if: ${{ !cancelled() && steps.checkout.outcome == 'failure' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: *check-checkout
      - uses: ./.github/actions/pnpm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: ./.github/actions/electron-download
      # The journey runs the installed app, so the check's own install builds
      # nothing: the machine has no Python or compiler for native modules. It
      # only refuses an install that left out a package, as the postinstall
      # does, and compiles the message catalogs the journey's imports read.
      - run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-installed-packages.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/generate-messages.ts --compiled
        timeout-minutes: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installer
          path: ${{ runner.temp }}/windows-installer
      # Against the build job's own output, never only the artifact's list,
      # so the installer this machine runs is the one whose checksum the
      # release's upload job publishes (docs/windows.md). The artifact must
      # hold only that installer and its list, and the one file checked here
      # is the one run, by its full path, so no other file can stand in.
      # Then as a person's double-click runs it, silently: one click installs
      # for this person and opens the app through its Start menu entry.
      - name: Check the installer against the build's list and install it
        working-directory: ${{ runner.temp }}/windows-installer
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          $sum, $file = $env:SUMS.Trim() -split '\s+\*?', 2
          $names = @(Get-ChildItem -Force -Name)
          if ($names.Count -ne 2 -or $names -notcontains 'SHA256SUMS' -or $names -notcontains $file) { throw "the artifact holds $($names -join ', '), not only SHA256SUMS and $file" }
          if ((Get-Content SHA256SUMS -Raw).Trim() -ne $env:SUMS.Trim()) { throw "the artifact's SHA256SUMS is not the one the build reported" }
          $setup = (Get-Item -LiteralPath $file).FullName
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLower() -ne $sum) { throw "$file differs from the build's" }
          $p = Start-Process -FilePath $setup -ArgumentList '/S', '--force-run' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "the installer ended with $($p.ExitCode)" }
      - name: Check the installed app
        env:
          INFINITARY_INSTALLED_EVIDENCE: ${{ runner.temp }}/windows-evidence
          INFINITARY_INSTALLED_VERSION: ${{ needs.build.outputs.version }}
          INFINITARY_WINDOWS_HOME_LINK: ${{ inputs.home_link }}
        run: pnpm exec playwright test --config playwright.windows.config.ts
      # Kept even when the job's timeout cancels it, so a hang leaves its
      # pictures and trace.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: ${{ format('windows-evidence-round-{0}', matrix.round) }}
          path: |
            ${{ runner.temp }}/windows-evidence
            test-results/windows
          if-no-files-found: ignore
          retention-days: 7
