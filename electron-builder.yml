appId: com.getinfinitary.infinitary
productName: Infinitary
copyright: Copyright (c) 2026 Kun Chen
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: packaging/build

asar: true

# Direct copies carry their own ownership; Homebrew replaces this receipt before moving its copy into Applications.
afterPack: ./scripts/mark-mac-installation.mjs

# Anything the app spawns must sit on disk NEXT TO the archive, not inside
# it: `child_process.spawn` cannot execute a path inside app.asar (only
# execFile is asar-aware), and a status read that cannot spawn reads as a
# signed-out account (src/core/claude/claudeCli.ts). Nothing spawnable ships
# in the archive today - the Claude client is the machine's own install, see
# `files` - so this list is the native addons alone.
asarUnpack:
  # The host Keychain FFI (CD-5=B) loads koffi from the main process. Native
  # addons cannot dlopen from inside app.asar. koffi's JS lives in
  # node_modules/koffi; the Mach-O is in the optional @koromix platform
  # packages (same skip-lipo pattern as the clipboard helpers).
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-darwin-*/**
  # The voice helper's ONNX Runtime (docs/architecture.md section 8): its
  # N-API addon and the library beside it load from disk, never from the
  # archive.
  - node_modules/onnxruntime-node/bin/**

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.md"
  # The app ships no Claude client (F14, captain lock 2026-09-20): a Claude
  # account runs the Claude Code the person installed, the same install that
  # holds the machine's default login. The SDK's platform packages (one
  # ~300 MB binary per platform, its optionalDependencies) stay in
  # node_modules for dev and CI and never enter the package;
  # tests/release-contract.test.ts pins this line.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # Chord depends on esbuild only for `@earendil-works/chord/bundler`. The
  # app and the Pi sessions it runs import chord, chord/context, and
  # chord/delta, never the bundler, so the binary is not a runtime need.
  # It is a single-arch Mach-O; both universal slices were carrying the
  # same copy and the merge aborted. Leave it in node_modules for dev.
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"

# Electron fuses per docs/architecture.md section 4: no node-mode escape
# hatches in the packaged binary, and the asar is integrity-checked and the
# only loadable app source.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# The complete git-tracked tree at the built commit, plus the behavior→source
# index. Generated by scripts/generate-self-source.mjs. Read-only data: the
# app never executes from this tree.
extraResources:
  - from: vendor/load-bin
    to: load-bin
    filter: [infinitary-load-supervisor]
  - from: packaging/app-update.yml
    to: app-update.yml
  - from: packaging/generated/self-source
    to: self-source
  - from: packaging/generated/self-map.json
    to: self-map.json
  # The offline release-notes catalog (docs/release-notes.md): this exact
  # version's reviewed entries and every published release's membership.
  # `pnpm build` leaves a placeholder; the release workflow replaces it with
  # the catalog its notes job generated and verifies the packaged copy.
  - from: packaging/generated/release-notes.json
    to: release-notes.json
  # Its highlights' hero pictures, in release-notes/pictures beside it: the
  # notes job writes them with the catalog, verify-package checks each one's
  # hash, and `pnpm build` leaves the folder empty.
  - from: packaging/generated/release-notes
    to: release-notes
  # The app's own git helper (git integration PR 1.2, docs/forge.md): git
  # runs it by path (GIT_ASKPASS), so it ships outside the archive, where
  # a spawn can execute it, with its executable mode.
  - from: resources/git-askpass
    to: git-askpass
  # The app's own git (git integration phase 2, docs/forge.md): dugite-native's
  # git for both architectures, vendored by scripts/ensure-bundled-git.ts
  # (postinstall) and picked at run time by process.arch
  # (src/core/workspace/bundledGit.ts). Spawned by path, so it ships here,
  # outside the archive, with its symlinks and executable modes.
  - from: vendor/git
    to: git
  # The one-file directory that puts that git first on a crewmate's search
  # path (src/core/hostEnv.ts): scripts/git-launcher.c, compiled for both
  # chips in one file by scripts/build-git-launcher.ts (postinstall), so the
  # universal merge takes it as it is.
  - from: vendor/git-bin
    to: git-bin
  # The task commands' launcher (docs/axi-commands.md): one shell script and
  # its infinitary-<tool>-axi links, put first on the search path of a task's shell
  # that has the tool (src/core/axi/channel.ts). A shell runs it by path, so
  # it ships here, outside the archive, with its links and executable mode.
  - from: resources/axi-bin
    to: axi-bin

mac:
  minimumSystemVersion: "12.0"
  category: public.app-category.developer-tools
  # onnxruntime-node carries every platform's build; each system's package
  # ships only its own (Apple silicon here: the package ships no Intel
  # build). electron-builder adds a system's `files` to the list above.
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
  # Apple's iconutil icns of packaging/build/icon.png, the 1024px transparent
  # png with an inset, rounded body rendered from the design skill's
  # app-icon.svg (scripts/render-app-icon.mjs, scripts/render-app-icns.mjs).
  # electron-builder ships an icns unchanged; its own png conversion stores
  # the small sizes in a form macOS draws as stripes.
  icon: packaging/build/icon.icns
  target:
    - target: zip
      arch:
        - universal
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing per the pi-launcher standard (docs/architecture.md section 10):
  # Developer ID Application, team 9T2J7MNUP9 - the existing certificate,
  # never a new one. CI restores it into a throwaway keychain; local builds
  # use electron-builder.dev.yml, which signs with a machine-local
  # self-signed certificate (docs/local-code-signing.md) and never with
  # this one.
  identity: "Kun Chen (9T2J7MNUP9)"
  entitlements: packaging/entitlements.plist
  entitlementsInherit: packaging/entitlements.plist
  # The sentence macOS shows when it first asks for the microphone
  # (docs/composer.md, "Voice"). electron-builder.dev.yml's own extendInfo
  # merges over this one, so the local app carries it too, as it does the
  # local network's below.
  extendInfo:
    NSMicrophoneUsageDescription: Infinitary hears you only while you talk to it. What you say becomes text on this computer and is never stored.
    # The sentence macOS shows if it asks about the local network
    # (docs/devices.md, "Macs nearby"). It adds no permission: listing Macs
    # nearby needs no entitlement and no Bonjour service list on macOS.
    NSLocalNetworkUsageDescription: Infinitary lists the computers on your network that have Remote Login on, so you can add one, reaches the computers you added, and lets your phone find this Mac.
    # The sentence macOS shows when a crewmate's search reaches another
    # app's data (docs/macos-privacy.md). macOS shows one sentence for every
    # such question, so it cannot name the task; the task's own record does.
    NSAppDataUsageDescription: A crewmate's search reached files that another app keeps. Infinitary's work rarely needs them, so Don't Allow is usually fine.
  # Per-arch native trees the universal merge must take as-is instead of
  # lipo-ing. @electron/universal lipo-s Mach-O files that differ across
  # slices; identical copies of a single-arch binary (same path, same SHA
  # in both slices) must match this glob or the merge aborts. pnpm
  # supportedArchitectures installs both darwin arches, so each slice
  # already carries both copies of every per-arch package: covering them
  # here keeps those copies, it does not substitute the wrong arch. The
  # pattern is koffi's @koromix darwin addons (CD-5=B), pi-tui, the pi
  # clipboard helpers, better-sqlite3 prebuilds, and the voice helper's
  # Apple silicon ONNX Runtime (the same copy in both slices). The Claude
  # SDK's platform binaries are excluded from `files` and never reach the
  # merge.
  # The app's own git ships both architectures' trees side by side in each
  # slice (Contents/Resources/git/darwin-{arm64,x64}), the same shape.
  x64ArchFiles: "Contents/Resources/{app.asar.unpacked/node_modules/{koffi,@koromix/koffi-darwin-arm64,@koromix/koffi-darwin-x64,@earendil-works/pi-tui/native,@mariozechner/clipboard-darwin-arm64,@mariozechner/clipboard-darwin-x64,better-sqlite3/prebuilds,onnxruntime-node/bin},git/darwin-arm64,git/darwin-x64}/**"

dmg:
  writeUpdateInfo: false
  # The installer window's title and volume name; without it the universal
  # build appends "-universal" to the version.
  title: Infinitary
  # dmg-builder joins dmg-background@2x.png beside it into one Retina picture
  # (scripts/render-dmg-background.mjs renders both from the svg).
  background: packaging/build/dmg-background.png
  window:
    width: 600
    height: 360
  iconSize: 96
  iconTextSize: 13
  contents:
    - x: 140
      y: 190
      type: file
    - x: 460
      y: 190
      type: link
      path: /Applications

publish: null
