  maps     every map file to draw, keyed by its folder from the project's top ("" for the top).
  counts   optional, by a part's folder: { "files": 40, "lines": 12034 }, from git ls-files and wc.
  compare  optional, one entry per comparison button:
           { "label": "This pull request",
             "files": [["src/core/tasks/store.ts", "~", 12, 3]],   path, + - or ~, lines added, lines removed

             "names": { "<machine>": { "<state now>": "<state it was>" } },
             "untraced": ["<machine you did not trace>"] }

  open     optional: { "at": "<a part's folder, or a machine's name>", "changes": <a comparison's number> }
