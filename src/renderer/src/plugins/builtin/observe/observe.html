<!--
  Observe, as a Tier-2 template (docs/dev-observe.md for the information
  architecture; docs/ui-plugins.md for the vehicle). Markup and its own
  stylesheet only: the frame carries the design tokens, the typefaces, and
  the base rules; observe.frame.js paints the data the host pushes. Tokens
  only, sentence case, uppercase micro-labels, mono for ids and clocks,
  failures the one hot thing on screen.
-->
<style>
  :root {
    --observe-list-width: 280px;
    --observe-clock-width: 64px;
  }
  html, body { height: 100%; }
  body { padding: 0; display: flex; flex-direction: column; gap: var(--space-4); }
  [data-observe-root] { display: flex; flex-direction: column; gap: var(--space-4); height: 100%; min-height: 0; }
  [data-observe-banner] {
    font-size: var(--text-sm); color: var(--fg-3);
    padding: var(--space-2) var(--space-4);
    background: var(--bg-1); border: 1px solid var(--line-1); border-radius: var(--radius-m);
    flex: 0 0 auto;
  }
  [data-observe-error] { color: var(--danger); font-size: var(--text-sm); flex: 0 0 auto; }
  [data-observe-error][hidden] { display: none; }
  [data-observe-pane] {
    display: flex; flex: 1 1 auto; min-height: 0;
    border: 1px solid var(--line-1); border-radius: var(--radius-m); overflow: hidden;
    background: var(--bg-1);
  }
  [data-observe-session-list] {
    width: var(--observe-list-width); flex-shrink: 0; min-width: 0;
    border-right: 1px solid var(--line-1); overflow-y: auto; overflow-anchor: none;
  }
  [data-observe-group] { border-bottom: 1px solid var(--line-1); }
  [data-observe-group][hidden] { display: none; }
  [data-observe-group]:last-child { border-bottom: none; }
  .mount-row { display: block; padding: var(--space-2) var(--space-4); border-left: 2px solid transparent; }
  .mount-note { padding: 0 var(--space-4) var(--space-2); font-size: var(--text-xs); color: var(--fg-3); line-height: var(--leading-body); }
  .group-label {
    font-size: var(--text-xs); font-weight: var(--weight-medium); letter-spacing: var(--tracking-label);
    text-transform: uppercase; color: var(--fg-3); padding: var(--space-3) var(--space-4) 6px;
  }
  .session-row {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    border-left: 2px solid transparent; border-radius: 0; cursor: pointer;
    padding: var(--space-2) var(--space-4); font-family: var(--font-ui); color: inherit;
  }
  .session-row:hover { background: var(--bg-2); }
  .session-row.hot { background: var(--danger-dim); }
  .session-row.selected { background: var(--accent-dim); border-left-color: var(--accent); }
  .row-badges { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-1); flex-wrap: wrap; }
  .row-title {
    font-size: var(--text-base); color: var(--fg-1); font-weight: var(--weight-medium);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-role { font-size: var(--text-xs); color: var(--fg-3); margin-top: 2px; line-height: var(--leading-body); }
  .row-identity { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3); margin-top: 2px; }
  .row-usage { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2); margin-top: var(--space-1); }
  .list-empty { padding: var(--space-4); color: var(--fg-3); font-size: var(--text-sm); }
  [data-observe-detail] { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  [data-observe-detail-header] {
    padding: var(--space-4) var(--space-4); border-bottom: 1px solid var(--line-1);
    display: flex; flex-direction: column; gap: var(--space-2);
  }
  .header-title { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .header-title .name { font-size: var(--text-md); color: var(--fg-1); font-weight: var(--weight-medium); }
  [data-observe-role] { font-size: var(--text-sm); color: var(--fg-2); line-height: var(--leading-body); }
  .header-identity {
    font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-2);
    display: flex; flex-wrap: wrap; gap: var(--space-3);
  }
  .header-usage { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--fg-1); }
  [data-observe-transcript] { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; }
  /* The two scrollers wear the feed's thin thumb (design/styles.css), not the default bar. */
  [data-observe-session-list]::-webkit-scrollbar, [data-observe-transcript]::-webkit-scrollbar { width: 3px; height: 3px; }
  [data-observe-session-list]::-webkit-scrollbar-track, [data-observe-transcript]::-webkit-scrollbar-track { background: transparent; }
  [data-observe-session-list]::-webkit-scrollbar-thumb, [data-observe-transcript]::-webkit-scrollbar-thumb { background: var(--fg-3); }
  [data-observe-session-list]::-webkit-scrollbar-button, [data-observe-transcript]::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  .transcript-body { padding: var(--space-4) var(--space-4) var(--space-5); }
  .window-row { display: flow-root; }
  .transcript-body > .window-row { padding-bottom: var(--space-3); }
  .session-row:focus-visible, [data-observe-transcript]:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .detail-empty { padding: var(--space-5); color: var(--fg-3); font-size: var(--text-sm); }
  .error-banner {
    padding: var(--space-2) var(--space-3); background: var(--danger-dim); border: 1px solid var(--danger);
    border-radius: var(--radius-s); color: var(--danger); font-size: var(--text-sm);
  }
  [data-observe-transcript-note] {
    padding: var(--space-2) var(--space-3); background: var(--bg-2); border: 1px solid var(--line-1);
    border-radius: var(--radius-s); color: var(--fg-3); font-size: var(--text-sm);
  }
  [data-observe-empty], [data-observe-loading] { color: var(--fg-3); font-size: var(--text-sm); }
  [data-observe-turn] { display: flex; gap: var(--space-3); min-width: 0; }
  .turn-clock {
    font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3);
    width: var(--observe-clock-width); flex-shrink: 0; padding-top: 2px;
  }
  .turn-main { min-width: 0; flex: 1; }
  .turn-label {
    font-size: var(--text-xs); font-weight: var(--weight-medium); letter-spacing: var(--tracking-label);
    text-transform: uppercase; margin-bottom: var(--space-1);
  }
  .turn-text { font-size: var(--text-sm); white-space: pre-wrap; word-break: break-word; }
  .turn-text.mono { font-family: var(--font-mono); }
  .turn-text.context { font-family: var(--font-mono); font-size: var(--text-xs); }
  .turn-usage { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-3); }
  .tone-fg1 { color: var(--fg-1); }
  .tone-fg2 { color: var(--fg-2); }
  .tone-fg3 { color: var(--fg-3); }
  .tone-danger { color: var(--danger); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-ui);
    font-size: var(--text-xs); font-weight: var(--weight-medium); letter-spacing: var(--tracking-label);
    text-transform: uppercase; border-radius: var(--radius-s); padding: 3px 8px; line-height: 1.4;
    border: 1px solid transparent;
  }
  .badge.mono { font-family: var(--font-mono); }
  .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge.neutral { color: var(--fg-2); background: var(--bg-3); }
  .badge.accent { color: var(--accent); background: var(--accent-dim); }
  .badge.ok { color: var(--ok); background: var(--ok-dim); }
  .badge.warn { color: var(--warn); background: var(--warn-dim); }
  .badge.danger { color: var(--danger); background: var(--danger-dim); }
  .badge.outline { color: var(--fg-2); background: transparent; border-color: var(--line-1); }
  /* A model chip keeps its whole name (the captain's 1C): its row wraps, and
     a name longer than the row wraps inside the chip, never cut. */
  .badge[data-model-chip] { flex-shrink: 0; max-width: 100%; overflow-wrap: anywhere; }
</style>
<div data-observe-root>
  <div data-observe-banner>
    Development and alpha builds only. Transcripts stay on this machine and this tab is absent
    from stable builds unless INFINITARY_DEV_OBSERVE=1.
  </div>
  <div data-observe-error hidden></div>
  <div data-observe-pane>
    <div data-observe-session-list></div>
    <div data-observe-detail></div>
  </div>
</div>
